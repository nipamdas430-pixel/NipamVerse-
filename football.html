<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NipamVerse — Football Recent</title>

<meta name="description"
content="NipamVerse Football Recent — football news, Argentina, Messi, clubs, stadiums and football moments.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.top{
    position:relative;
    z-index:100;
    padding:28px 20px 22px;
    text-align:center;
    background:
        linear-gradient(180deg,#08150c 0%,#07100a 75%,transparent 100%);
}

.top h1{
    font-size:clamp(30px,6vw,58px);
    font-weight:800;
    letter-spacing:-1.5px;
}

.top p{
    margin-top:8px;
    color:#a9b5ad;
    font-size:14px;
}

.line{
    width:90px;
    height:3px;
    margin:17px auto 0;
    background:#45d978;
    border-radius:20px;
}

/* =========================
   WORLD VIEWPORT
========================= */

.world-section{
    position:relative;
    width:100%;
    height:78vh;
    min-height:560px;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 50%,rgba(26,76,43,.28),transparent 48%),
        linear-gradient(135deg,#061009,#020403 55%,#07130b);

    border-top:1px solid rgba(100,255,150,.08);
    border-bottom:1px solid rgba(100,255,150,.08);

    cursor:grab;

    /* Important:
       browser will not take over the gesture */
    touch-action:none;

    user-select:none;
    -webkit-user-select:none;
}

.world-section.dragging{
    cursor:grabbing;
}

/* subtle football field lines */

.world-section::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:100px 100px;
    transform:rotate(0deg);
    pointer-events:none;
}

/* =========================
   MOVING WORLD
========================= */

.world{
    position:absolute;

    width:3600px;
    height:2400px;

    left:0;
    top:0;

    will-change:transform;
}

/* =========================
   CONTENT CARDS
========================= */

.card{
    position:absolute;

    width:330px;
    min-height:220px;

    border-radius:22px;
    overflow:hidden;

    background:#101611;

    border:1px solid rgba(126,255,161,.18);

    box-shadow:
        0 18px 45px rgba(0,0,0,.48),
        inset 0 0 0 1px rgba(255,255,255,.025);

    transform:none !important;
    perspective:none !important;

    transition:
        border-color .25s ease,
        box-shadow .25s ease;

    pointer-events:none;
}

.card:hover{
    border-color:rgba(91,239,128,.38);

    box-shadow:
        0 20px 55px rgba(0,0,0,.55),
        0 0 25px rgba(49,218,103,.08);
}

.card-image{
    width:100%;
    height:155px;
    object-fit:cover;
    display:block;
    background:#101510;
}

.card-body{
    padding:15px 16px 17px;
}

.card-title{
    font-size:17px;
    line-height:1.35;
    font-weight:700;
}

.card-meta{
    margin-top:9px;
    color:#8f9d93;
    font-size:11px;
}

/* =========================
   FEATURE CARDS
========================= */

.feature{
    width:390px;
    min-height:330px;
}

.feature .card-image{
    height:205px;
}

.feature .card-body{
    padding:18px 20px 21px;
}

.feature h2{
    font-size:25px;
    margin-bottom:8px;
}

.feature p{
    color:#aab5ad;
    font-size:13px;
    line-height:1.55;
}

/* =========================
   IMAGE PANELS
========================= */

.image-panel{
    position:absolute;

    width:400px;
    height:270px;

    border-radius:24px;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 20px 55px rgba(0,0,0,.55);

    pointer-events:none;
}

.image-panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.image-panel::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent 35%,
            rgba(0,0,0,.65)
        );
}

/* =========================
   NEWS AREA
========================= */

.news-label{
    position:absolute;
    left:50%;
    top:20px;

    transform:translateX(-50%);

    z-index:10;

    padding:9px 18px;

    background:rgba(5,10,7,.78);
    border:1px solid rgba(86,224,122,.2);

    border-radius:50px;

    backdrop-filter:blur(10px);

    font-size:12px;
    letter-spacing:1.2px;
    text-transform:uppercase;

    color:#c9d4cc;

    pointer-events:none;
}

/* =========================
   LOADING
========================= */

.loading{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:#94a39a;

    font-size:14px;

    pointer-events:none;
}

/* =========================
   BOTTOM INFO
========================= */

.info{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    z-index:10;

    padding:8px 14px;

    border-radius:30px;

    background:rgba(4,8,5,.7);
    border:1px solid rgba(255,255,255,.08);

    color:#7f8b83;

    font-size:11px;

    backdrop-filter:blur(8px);

    pointer-events:none;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:40px 20px 50px;

    color:#667169;
    font-size:12px;

    background:#030403;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        padding:23px 15px 19px;
    }

    .top h1{
        font-size:32px;
    }

    .world-section{
        height:76vh;
        min-height:520px;
    }

    .card{
        width:275px;
        min-height:195px;
        border-radius:18px;
    }

    .card-image{
        height:125px;
    }

    .card-body{
        padding:13px;
    }

    .card-title{
        font-size:15px;
    }

    .feature{
        width:310px;
        min-height:275px;
    }

    .feature .card-image{
        height:165px;
    }

    .feature h2{
        font-size:21px;
    }

    .image-panel{
        width:320px;
        height:215px;
        border-radius:20px;
    }

    .info{
        bottom:12px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     FIXED HEADER
========================= -->

<header class="top">
    <h1>Football Recent</h1>
    <p>Latest football stories, Argentina, Messi and the world of football</p>
    <div class="line"></div>
</header>


<!-- =========================
     2D FOOTBALL WORLD
========================= -->

<section class="world-section" id="worldViewport">

    <div class="news-label">
        Football World
    </div>

    <div class="loading" id="loading">
        Loading football world...
    </div>

    <div class="world" id="footballWorld">

        <!--
            CONTENT WILL BE CREATED HERE
            BY JAVASCRIPT
        -->

    </div>

    <div class="info">
        Drag in any direction
    </div>

</section>


<footer>
    © 2026 NipamVerse · Football Recent
</footer>


<script>

/* =========================================================
   FOOTBALL IMAGES
========================================================= */

const footballImages = [

    "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1553778263-73a05d7f4e2d?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1575361204480-aadea25e6e68?auto=format&fit=crop&w=1000&q=85",

    "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=85"
];


/* =========================================================
   WORLD SETUP
========================================================= */

const viewport = document.getElementById("worldViewport");
const world = document.getElementById("footballWorld");
const loading = document.getElementById("loading");

const WORLD_W = 3600;
const WORLD_H = 2400;


/* =========================================================
   STATIC FOOTBALL CONTENT
========================================================= */

const staticContent = [

    {
        type:"feature",
        title:"Argentina Zone",
        text:"Argentina football, national team moments, major tournaments and the latest stories.",
        image:footballImages[3],
        x:250,
        y:260
    },

    {
        type:"feature",
        title:"Messi Zone",
        text:"Lionel Messi moments, career highlights, records and football stories.",
        image:footballImages[0],
        x:1760,
        y:300
    },

    {
        type:"image",
        image:footballImages[4],
        x:2900,
        y:240
    },

    {
        type:"image",
        image:footballImages[6],
        x:520,
        y:900
    },

    {
        type:"image",
        image:footballImages[2],
        x:2700,
        y:900
    },

    {
        type:"image",
        image:footballImages[1],
        x:1200,
        y:1700
    },

    {
        type:"image",
        image:footballImages[5],
        x:3000,
        y:1700
    }
];


/* =========================================================
   CREATE STATIC CONTENT
========================================================= */

function createStaticContent(){

    staticContent.forEach(item => {

        if(item.type === "feature"){

            const card = document.createElement("div");

            card.className = "card feature";

            card.style.left = item.x + "px";
            card.style.top = item.y + "px";

            card.innerHTML = `
                <img
                    class="card-image"
                    src="${item.image}"
                    alt="${item.title}"
                >

                <div class="card-body">
                    <h2>${item.title}</h2>
                    <p>${item.text}</p>
                </div>
            `;

            world.appendChild(card);

        }

        if(item.type === "image"){

            const panel = document.createElement("div");

            panel.className = "image-panel";

            panel.style.left = item.x + "px";
            panel.style.top = item.y + "px";

            panel.innerHTML = `
                <img
                    src="${item.image}"
                    alt="Football image"
                >
            `;

            world.appendChild(panel);
        }

    });
}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   NEWS CARD
========================================================= */

function createNewsCard(item,index){

    const card = document.createElement("article");

    card.className = "card";

    /*
       Spread cards throughout the world.
       This is deliberately NOT one horizontal row.
    */

    const columns = 6;

    const col = index % columns;
    const row = Math.floor(index / columns);

    const positions = [
        {x:80,y:80},
        {x:720,y:100},
        {x:1380,y:90},
        {x:2060,y:80},
        {x:2720,y:100},
        {x:3260,y:90},

        {x:100,y:650},
        {x:750,y:700},
        {x:1450,y:650},
        {x:2100,y:690},
        {x:2750,y:650},
        {x:3300,y:700},

        {x:90,y:1240},
        {x:700,y:1300},
        {x:1400,y:1240},
        {x:2050,y:1290},
        {x:2700,y:1240},
        {x:3290,y:1300},

        {x:120,y:1900},
        {x:760,y:1860},
        {x:1430,y:1930},
        {x:2100,y:1870},
        {x:2750,y:1920},
        {x:3300,y:1870}
    ];

    const position = positions[index % positions.length];

    card.style.left = position.x + "px";
    card.style.top = position.y + "px";

    const image =
        item.image ||
        footballImages[index % footballImages.length];

    const title =
        item.title ||
        item.headline ||
        "Latest football story";

    const source =
        item.source ||
        "Football Recent";

    const date =
        item.date ||
        item.published ||
        "";

    card.innerHTML = `
        <img
            class="card-image"
            src="${escapeHTML(image)}"
            alt="Football news"
            onerror="this.src='${footballImages[index % footballImages.length]}'"
        >

        <div class="card-body">

            <div class="card-title">
                ${escapeHTML(title)}
            </div>

            <div class="card-meta">
                ${escapeHTML(source)}
                ${date ? " · " + escapeHTML(date) : ""}
            </div>

        </div>
    `;

    return card;
}


/* =========================================================
   LOAD AUTOMATIC NEWS
========================================================= */

async function loadNews(){

    try{

        const response =
            await fetch(
                "football-news.json?cache=" +
                Date.now()
            );

        if(!response.ok){
            throw new Error("News file not found");
        }

        const data = await response.json();

        let news = [];

        if(Array.isArray(data)){
            news = data;
        }
        else if(Array.isArray(data.news)){
            news = data.news;
        }
        else if(Array.isArray(data.articles)){
            news = data.articles;
        }

        /*
           Keep enough cards to fill the world.
        */

        news = news.slice(0,24);

        news.forEach((item,index)=>{

            world.appendChild(
                createNewsCard(item,index)
            );

        });

    }
    catch(error){

        /*
           If JSON temporarily fails,
           create beautiful fallback cards.
        */

        const fallbackTitles = [

            "Latest football news",

            "World football update",

            "Argentina football",

            "European football",

            "Champions League stories",

            "International football",

            "Football transfer update",

            "Major football moments",

            "Club football latest",

            "Football world report",

            "Argentina national team",

            "Messi football update"

        ];

        fallbackTitles.forEach((title,index)=>{

            world.appendChild(
                createNewsCard(
                    {
                        title:title,
                        source:"NipamVerse Football",
                        image:footballImages[
                            index % footballImages.length
                        ]
                    },
                    index
                )
            );

        });

    }

    loading.style.display = "none";

}


/* =========================================================
   2D INFINITE DRAG SYSTEM
========================================================= */

let x = -700;
let y = -450;

let startX = 0;
let startY = 0;

let startWorldX = 0;
let startWorldY = 0;

let dragging = false;
let pointerId = null;


/*
   We use a repeating 2D world.

   No rotation.
   No perspective.
   No 3D transforms.

   Only:
       translateX
       translateY
*/

function applyWorld(){

    world.style.transform =
        `translate3d(${x}px,${y}px,0)`;
}


/* =========================================================
   WRAP POSITION
========================================================= */

function wrapWorld(){

    /*
       Keep movement continuous.

       The world repeats every WORLD_W / WORLD_H.
    */

    const repeatX = WORLD_W * 0.75;
    const repeatY = WORLD_H * 0.75;

    while(x < -repeatX){
        x += repeatX;
    }

    while(x > 0){
        x -= repeatX;
    }

    while(y < -repeatY){
        y += repeatY;
    }

    while(y > 0){
        y -= repeatY;
    }
}


/* =========================================================
   POINTER DOWN
========================================================= */

viewport.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        pointerId = e.pointerId;

        startX = e.clientX;
        startY = e.clientY;

        startWorldX = x;
        startWorldY = y;

        viewport.classList.add("dragging");

        viewport.setPointerCapture(e.pointerId);

        e.preventDefault();

    },
    {passive:false}
);


/* =========================================================
   POINTER MOVE
========================================================= */

viewport.addEventListener(
    "pointermove",
    function(e){

        if(!dragging || e.pointerId !== pointerId){
            return;
        }

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        x = startWorldX + dx;
        y = startWorldY + dy;

        wrapWorld();

        applyWorld();

        e.preventDefault();

    },
    {passive:false}
);


/* =========================================================
   END DRAG
========================================================= */

function endDrag(e){

    if(e.pointerId !== pointerId){
        return;
    }

    dragging = false;

    viewport.classList.remove("dragging");

    try{
        viewport.releasePointerCapture(e.pointerId);
    }catch(err){}

    pointerId = null;
}


viewport.addEventListener(
    "pointerup",
    endDrag
);

viewport.addEventListener(
    "pointercancel",
    endDrag
);

viewport.addEventListener(
    "lostpointercapture",
    function(){
        dragging = false;
        viewport.classList.remove("dragging");
    }
);


/* =========================================================
   INITIAL WORLD
========================================================= */

createStaticContent();

loadNews();

applyWorld();

</script>

</body>
      </html>
