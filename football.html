<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NipamVerse — Football Recent</title>

<meta name="description"
content="NipamVerse Football Recent — latest football news, Argentina, Messi and world football.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#030504;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* =========================
   FIXED HEADING
========================= */

.header{
    position:relative;
    z-index:50;
    text-align:center;
    padding:28px 18px 24px;
    background:
        linear-gradient(
            180deg,
            #08130c 0%,
            #061009 72%,
            #030504 100%
        );
}

.header h1{
    font-size:clamp(32px,6vw,58px);
    font-weight:800;
    letter-spacing:-1.5px;
}

.header p{
    margin-top:9px;
    color:#9eaaa1;
    font-size:14px;
}

.header-line{
    width:82px;
    height:3px;
    margin:16px auto 0;
    border-radius:10px;
    background:#43dc76;
}


/* =========================
   VIEWPORT
========================= */

.viewport{
    position:relative;
    width:100%;
    height:78vh;
    min-height:560px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(35,100,55,.25),
            transparent 52%
        ),
        #030604;

    border-top:1px solid rgba(100,255,150,.08);
    border-bottom:1px solid rgba(100,255,150,.08);

    cursor:grab;

    /*
       Browser does not perform its own
       touch scrolling inside this area.
    */
    touch-action:none;

    user-select:none;
    -webkit-user-select:none;
}

.viewport.dragging{
    cursor:grabbing;
}


/* =========================
   SUBTLE FIELD BACKGROUND
========================= */

.field{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.18;
}

.field::before,
.field::after{
    content:"";
    position:absolute;
    pointer-events:none;
}

.field::before{
    width:700px;
    height:700px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(91,224,124,.16);
    border-radius:50%;
}

.field::after{
    width:1px;
    height:100%;

    left:50%;
    top:0;

    background:rgba(91,224,124,.13);
}


/* =========================
   INFINITE WORLD
========================= */

.world{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    will-change:transform;

    /*
       The world itself is visually infinite
       because its tiles are repeated.
    */
}


/* =========================
   TILE
========================= */

.tile{
    position:absolute;

    width:760px;
    height:560px;

    pointer-events:none;
}


/* =========================
   NEWS CARD
========================= */

.news-card{
    position:absolute;

    width:285px;

    min-height:235px;

    overflow:hidden;

    border-radius:20px;

    background:#101611;

    border:1px solid rgba(118,240,148,.17);

    box-shadow:
        0 16px 40px rgba(0,0,0,.48),
        inset 0 0 0 1px rgba(255,255,255,.025);

    transform:none !important;
    perspective:none !important;
}

.news-image{
    display:block;

    width:100%;
    height:140px;

    object-fit:cover;

    background:#0b100c;
}

.news-body{
    padding:14px 15px 16px;
}

.news-title{
    font-size:15px;
    line-height:1.38;
    font-weight:700;
}

.news-meta{
    margin-top:9px;

    color:#89958d;

    font-size:10px;
}


/* =========================
   ARGENTINA / MESSI
========================= */

.feature-card{
    position:absolute;

    width:360px;
    min-height:310px;

    overflow:hidden;

    border-radius:22px;

    background:#101611;

    border:1px solid rgba(118,240,148,.18);

    box-shadow:
        0 18px 50px rgba(0,0,0,.5);

    transform:none !important;
}

.feature-image{
    width:100%;
    height:195px;

    object-fit:cover;

    display:block;
}

.feature-body{
    padding:17px 18px 19px;
}

.feature-body h2{
    font-size:23px;
    margin-bottom:8px;
}

.feature-body p{
    color:#9aa69e;
    font-size:12px;
    line-height:1.55;
}


/* =========================
   FOOTBALL IMAGE
========================= */

.photo{
    position:absolute;

    width:300px;
    height:205px;

    overflow:hidden;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.11);

    box-shadow:
        0 18px 45px rgba(0,0,0,.5);
}

.photo img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}


/* =========================
   WORLD LABEL
========================= */

.world-label{
    position:absolute;

    z-index:20;

    left:50%;
    top:17px;

    transform:translateX(-50%);

    padding:8px 16px;

    border-radius:30px;

    background:rgba(3,7,4,.72);

    border:1px solid rgba(112,237,143,.16);

    color:#b7c2ba;

    font-size:11px;

    letter-spacing:1.1px;

    text-transform:uppercase;

    backdrop-filter:blur(9px);

    pointer-events:none;
}


/* =========================
   DRAG HINT
========================= */

.hint{
    position:absolute;

    z-index:20;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    padding:7px 13px;

    border-radius:20px;

    background:rgba(3,7,4,.72);

    border:1px solid rgba(255,255,255,.07);

    color:#78847c;

    font-size:10px;

    pointer-events:none;
}


/* =========================
   LOADING
========================= */

.loading{
    position:absolute;

    z-index:30;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:#89968d;

    font-size:13px;

    pointer-events:none;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    padding:38px 20px 48px;

    background:#020302;

    color:#657169;

    font-size:11px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:23px 14px 20px;
    }

    .header h1{
        font-size:32px;
    }

    .header p{
        font-size:12px;
    }

    .viewport{
        height:76vh;
        min-height:520px;
    }

    .news-card{
        width:255px;
        min-height:210px;
    }

    .news-image{
        height:122px;
    }

    .feature-card{
        width:315px;
        min-height:280px;
    }

    .feature-image{
        height:165px;
    }

    .feature-body h2{
        font-size:21px;
    }

    .photo{
        width:270px;
        height:180px;
    }
}
</style>
</head>


<body>


<!-- =========================
     FIXED HEADING
========================= -->

<header class="header">

    <h1>Football Recent</h1>

    <p>
        Latest football stories, Argentina, Messi and world football
    </p>

    <div class="header-line"></div>

</header>


<!-- =========================
     FOOTBALL WORLD
========================= -->

<section
    class="viewport"
    id="viewport"
>

    <div class="field"></div>

    <div class="world-label">
        Football World
    </div>

    <div
        class="loading"
        id="loading"
    >
        Loading football world...
    </div>

    <div
        class="world"
        id="world"
    ></div>

    <div class="hint">
        Drag in any direction
    </div>

</section>


<footer>
    © 2026 NipamVerse · Football Recent
</footer>


<script>

/* =========================================================
   IMAGE COLLECTION
========================================================= */

const images = [

    "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1200&q=85",

    "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=1200&q=85",

    "https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=1200&q=85",

    "https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?auto=format&fit=crop&w=1200&q=85",

    "https://images.unsplash.com/photo-1575361204480-aadea25e6e68?auto=format&fit=crop&w=1200&q=85",

    "https://images.unsplash.com/photo-1553778263-73a05d7f4e2d?auto=format&fit=crop&w=1200&q=85"
];


/* =========================================================
   WORLD TILE SIZE
========================================================= */

const TILE_W = 1520;
const TILE_H = 1120;


/* =========================================================
   WORLD CONTENT
========================================================= */

const world = document.getElementById("world");

const viewport = document.getElementById("viewport");

const loading = document.getElementById("loading");


/* =========================================================
   ESCAPE HTML
========================================================= */

function safe(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   NEWS DATA
========================================================= */

let newsData = [];


/* =========================================================
   NEWS CARD
========================================================= */

function makeNews(item,x,y,index){

    const card =
        document.createElement("article");

    card.className = "news-card";

    card.style.left = x + "px";
    card.style.top = y + "px";

    const image =
        item.image ||
        images[index % images.length];

    const title =
        item.title ||
        item.headline ||
        "Latest football story";

    const source =
        item.source ||
        "NipamVerse Football";

    const date =
        item.date ||
        item.published ||
        "";

    card.innerHTML = `

        <img
            class="news-image"
            src="${safe(image)}"
            alt="Football news"
            onerror="this.src='${images[index % images.length]}'"
        >

        <div class="news-body">

            <div class="news-title">
                ${safe(title)}
            </div>

            <div class="news-meta">
                ${safe(source)}
                ${date ? " · " + safe(date) : ""}
            </div>

        </div>
    `;

    return card;
}


/* =========================================================
   FEATURE CARD
========================================================= */

function makeFeature(
    title,
    text,
    image,
    x,
    y
){

    const card =
        document.createElement("article");

    card.className = "feature-card";

    card.style.left = x + "px";
    card.style.top = y + "px";

    card.innerHTML = `

        <img
            class="feature-image"
            src="${image}"
            alt="${safe(title)}"
        >

        <div class="feature-body">

            <h2>
                ${safe(title)}
            </h2>

            <p>
                ${safe(text)}
            </p>

        </div>
    `;

    return card;
}


/* =========================================================
   PHOTO
========================================================= */

function makePhoto(image,x,y){

    const photo =
        document.createElement("div");

    photo.className = "photo";

    photo.style.left = x + "px";
    photo.style.top = y + "px";

    photo.innerHTML = `

        <img
            src="${image}"
            alt="Football"
        >
    `;

    return photo;
}


/* =========================================================
   CREATE ONE TILE
========================================================= */

function createTile(
    tileX,
    tileY
){

    const tile =
        document.createElement("div");

    tile.className = "tile";

    tile.style.left = tileX + "px";
    tile.style.top = tileY + "px";


    /* -------------------------
       FEATURES
    ------------------------- */

    tile.appendChild(
        makeFeature(
            "Argentina Zone",
            "Argentina football, national team stories, tournaments and major moments.",
            images[2],
            40,
            40
        )
    );


    tile.appendChild(
        makeFeature(
            "Messi Zone",
            "Lionel Messi moments, records, career highlights and football stories.",
            images[0],
            590,
            40
        )
    );


    /* -------------------------
       NEWS CARDS
    ------------------------- */

    const positions = [

        [20,400],
        [340,400],
        [660,400],
        [980,400],

        [20,670],
        [340,670],
        [660,670],
        [980,670],

        [20,940],
        [340,940],
        [660,940],
        [980,940]
    ];


    positions.forEach(
        (pos,index)=>{

            const item =
                newsData.length
                    ? newsData[
                        index %
                        newsData.length
                      ]
                    : {
                        title:
                            "Football world update",
                        source:
                            "NipamVerse Football"
                    };

            tile.appendChild(
                makeNews(
                    item,
                    pos[0],
                    pos[1],
                    index
                )
            );
        }
    );


    /* -------------------------
       FOOTBALL IMAGES
    ------------------------- */

    tile.appendChild(
        makePhoto(
            images[3],
            1240,
            70
        )
    );

    tile.appendChild(
        makePhoto(
            images[4],
            1240,
            350
        )
    );

    tile.appendChild(
        makePhoto(
            images[5],
            1240,
            630
        )
    );


    world.appendChild(tile);
}


/* =========================================================
   BUILD MANY REPEATED TILES
========================================================= */

function buildWorld(){

    world.innerHTML = "";

    /*
       3 x 3 tiles are always kept around
       the viewport.

       The tiles repeat forever mathematically.
    */

    for(let row=-1;row<=1;row++){

        for(let col=-1;col<=1;col++){

            createTile(
                col * TILE_W,
                row * TILE_H
            );

        }
    }

}


/* =========================================================
   LOAD NEWS JSON
========================================================= */

async function loadNews(){

    try{

        const response =
            await fetch(
                "football-news.json?x=" +
                Date.now()
            );

        if(!response.ok){
            throw new Error("News unavailable");
        }

        const data =
            await response.json();


        if(Array.isArray(data)){

            newsData = data;

        }
        else if(Array.isArray(data.news)){

            newsData = data.news;

        }
        else if(Array.isArray(data.articles)){

            newsData = data.articles;

        }


        /*
           Use up to 24 current stories.
        */

        newsData =
            newsData.slice(0,24);

    }
    catch(error){

        newsData = [

            {
                title:"Latest football news",
                source:"NipamVerse Football"
            },

            {
                title:"World football update",
                source:"NipamVerse Football"
            },

            {
                title:"Argentina football update",
                source:"NipamVerse Football"
            },

            {
                title:"Messi football update",
                source:"NipamVerse Football"
            },

            {
                title:"Club football latest",
                source:"NipamVerse Football"
            },

            {
                title:"International football",
                source:"NipamVerse Football"
            }

        ];

    }


    buildWorld();

    loading.style.display = "none";

}


/* =========================================================
   INFINITE POSITION
========================================================= */

let offsetX = -760;
let offsetY = -560;


/*
   Instead of stopping at an edge,
   we move the world back by exactly
   one tile when necessary.

   Therefore the content never ends.
*/

function normalize(){

    while(offsetX <= -TILE_W){

        offsetX += TILE_W;

    }

    while(offsetX > 0){

        offsetX -= TILE_W;

    }


    while(offsetY <= -TILE_H){

        offsetY += TILE_H;

    }

    while(offsetY > 0){

        offsetY -= TILE_H;

    }

}


/* =========================================================
   APPLY MOVEMENT
========================================================= */

function render(){

    world.style.transform =
        "translate(" +
        offsetX +
        "px," +
        offsetY +
        "px)";

}


/* =========================================================
   POINTER DRAG
========================================================= */

let dragging = false;

let pointerId = null;

let startPointerX = 0;
let startPointerY = 0;

let startOffsetX = 0;
let startOffsetY = 0;


/* -------------------------
   DOWN
------------------------- */

viewport.addEventListener(
    "pointerdown",
    function(event){

        /*
           Only primary pointer.
        */

        if(!event.isPrimary){
            return;
        }

        dragging = true;

        pointerId =
            event.pointerId;

        startPointerX =
            event.clientX;

        startPointerY =
            event.clientY;

        startOffsetX =
            offsetX;

        startOffsetY =
            offsetY;


        viewport.classList.add(
            "dragging"
        );


        /*
           Keep receiving movement
           even if pointer leaves viewport.
        */

        viewport.setPointerCapture(
            event.pointerId
        );


        event.preventDefault();

    },
    {passive:false}
);


/* -------------------------
   MOVE
------------------------- */

viewport.addEventListener(
    "pointermove",
    function(event){

        if(
            !dragging ||
            event.pointerId !== pointerId
        ){
            return;
        }


        const dx =
            event.clientX -
            startPointerX;

        const dy =
            event.clientY -
            startPointerY;


        offsetX =
            startOffsetX + dx;

        offsetY =
            startOffsetY + dy;


        normalize();

        render();


        event.preventDefault();

    },
    {passive:false}
);


/* -------------------------
   END
------------------------- */

function stopDrag(event){

    if(
        event.pointerId !== pointerId
    ){
        return;
    }

    dragging = false;

    viewport.classList.remove(
        "dragging"
    );


    try{

        viewport.releasePointerCapture(
            event.pointerId
        );

    }catch(error){}


    pointerId = null;
}


viewport.addEventListener(
    "pointerup",
    stopDrag
);

viewport.addEventListener(
    "pointercancel",
    stopDrag
);


/* =========================================================
   START
========================================================= */

buildWorld();

loadNews();

render();

</script>

</body>
    </html>
