<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Carrom Pool — NipamVerse</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#020502;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

body{
  overflow-x:hidden;
}

h1{
  margin:10px 0 5px;
  color:#39ff88;
  text-shadow:0 0 15px #39ff88;
  font-size:28px;
}

#info{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:8px;
}

.box{
  background:#08120c;
  border:1px solid #39ff88;
  border-radius:10px;
  padding:5px 15px;
  min-width:85px;
  box-shadow:0 0 10px rgba(57,255,136,.15);
}

.small{
  font-size:10px;
  color:#8cffb8;
}

.big{
  font-size:19px;
  font-weight:bold;
}

#gameWrap{
  position:relative;
  width:min(94vw,620px);
  margin:auto;
}

canvas{
  display:block;
  width:100%;
  aspect-ratio:1;
  background:#08130b;
  border-radius:18px;
  box-shadow:0 0 30px rgba(57,255,136,.25);
  touch-action:none;
}

#controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  background:#39ff88;
  color:#001508;
  font-size:14px;
  font-weight:bold;
  box-shadow:0 0 12px rgba(57,255,136,.25);
}

button:active{
  transform:scale(.94);
}

#hint{
  margin:7px auto 12px;
  color:#8cae96;
  font-size:12px;
  max-width:500px;
}
</style>
</head>

<body>

<h1>CARROM POOL</h1>

<div id="info">

  <div class="box">
    <div class="small">SCORE</div>
    <div class="big" id="score">0</div>
  </div>

  <div class="box">
    <div class="small">BEST</div>
    <div class="big" id="best">0</div>
  </div>

</div>

<div id="gameWrap">
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <button onclick="moveStriker(-1)">◀ LEFT</button>
  <button onclick="newGame()">NEW GAME</button>
  <button onclick="moveStriker(1)">RIGHT ▶</button>
</div>

<div id="hint">
  Tap striker → drag backward → release to shoot 🎯
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const SIZE = 700;

canvas.width = SIZE;
canvas.height = SIZE;

const board = {
  x:35,
  y:35,
  size:630
};

const playLeft = board.x + 55;
const playRight = board.x + board.size - 55;
const playTop = board.y + 55;
const playBottom = board.y + board.size - 55;

const pocketRadius = 29;
const coinRadius = 12;
const strikerRadius = 17;

const pockets = [
  {x:board.x+22, y:board.y+22},
  {x:board.x+board.size-22, y:board.y+22},
  {x:board.x+22, y:board.y+board.size-22},
  {x:board.x+board.size-22, y:board.y+board.size-22}
];

let score = 0;

let best = Number(
  localStorage.getItem("nipam_carrom_best") || 0
);

document.getElementById("best").textContent = best;

let striker;
let coins = [];
let queen;

let aiming = false;
let moving = false;

let aimX = 0;
let aimY = 0;

let particles = [];

function newGame(){

  score = 0;

  document.getElementById("score").textContent = "0";

  striker = {
    x: SIZE/2,
    y: playBottom-8,
    vx:0,
    vy:0,
    active:true
  };

  coins = [];

  queen = {
    x: SIZE/2,
    y: SIZE/2,
    vx:0,
    vy:0,
    active:true
  };

  /*
    Central carrom formation
  */

  const positions = [

    [0,-2],
    [-1,-1],
    [0,-1],
    [1,-1],

    [-2,0],
    [-1,0],
    [1,0],
    [2,0],

    [-1,1],
    [0,1],
    [1,1],

    [0,2]

  ];

  positions.forEach((pos,i)=>{

    coins.push({
      x:SIZE/2 + pos[0]*27,
      y:SIZE/2 + pos[1]*27,
      vx:0,
      vy:0,
      active:true,
      type:i%2===0 ? "white" : "black"
    });

  });

  aiming=false;
  moving=false;

  particles=[];

}

function updateScore(){

  document.getElementById("score").textContent = score;

  if(score > best){

    best = score;

    localStorage.setItem(
      "nipam_carrom_best",
      best
    );

    document.getElementById("best").textContent = best;
  }
}

/* =========================
   BOARD
========================= */

function drawBoard(){

  ctx.fillStyle="#061008";
  ctx.fillRect(0,0,SIZE,SIZE);

  /* Outer wood */

  ctx.fillStyle="#794718";

  ctx.fillRect(
    board.x,
    board.y,
    board.size,
    board.size
  );

  /* Main wood */

  ctx.fillStyle="#d19a57";

  ctx.fillRect(
    board.x+12,
    board.y+12,
    board.size-24,
    board.size-24
  );

  /* Playing surface */

  ctx.fillStyle="#f0c985";

  ctx.fillRect(
    board.x+45,
    board.y+45,
    board.size-90,
    board.size-90
  );

  /* Border */

  ctx.strokeStyle="#5b3214";
  ctx.lineWidth=6;

  ctx.strokeRect(
    playLeft,
    playTop,
    playRight-playLeft,
    playBottom-playTop
  );

  /* Center */

  ctx.beginPath();

  ctx.arc(
    SIZE/2,
    SIZE/2,
    55,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="#8b4e20";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    SIZE/2,
    SIZE/2,
    10,
    0,
    Math.PI*2
  );

  ctx.stroke();

  /* Diagonal guide lines */

  ctx.beginPath();

  ctx.moveTo(playLeft+10,playTop+10);
  ctx.lineTo(playRight-10,playBottom-10);

  ctx.moveTo(playRight-10,playTop+10);
  ctx.lineTo(playLeft+10,playBottom-10);

  ctx.strokeStyle="#a66b32";
  ctx.lineWidth=2;
  ctx.stroke();

  /* Baseline */

  ctx.strokeStyle="#6b3c17";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    playLeft+65,
    playBottom-35
  );

  ctx.lineTo(
    playRight-65,
    playBottom-35
  );

  ctx.stroke();

  /* Pockets */

  pockets.forEach(p=>{

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      pocketRadius,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#090909";
    ctx.fill();

    ctx.strokeStyle="#42230f";
    ctx.lineWidth=5;
    ctx.stroke();

  });

}

/* =========================
   COINS
========================= */

function drawCoin(c){

  if(!c.active)return;

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    c.x,
    c.y,
    coinRadius,
    0,
    Math.PI*2
  );

  if(c.type==="white"){

    ctx.fillStyle="#f8ead0";

  }else{

    ctx.fillStyle="#171717";

  }

  ctx.fill();

  ctx.strokeStyle =
    c.type==="white"
    ? "#9c7447"
    : "#555";

  ctx.lineWidth=2;

  ctx.stroke();

  /* Shine */

  ctx.beginPath();

  ctx.arc(
    c.x-4,
    c.y-4,
    2.5,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,255,255,.6)";
  ctx.fill();

  ctx.restore();

}

/* =========================
   QUEEN
========================= */

function drawQueen(){

  if(!queen.active)return;

  ctx.beginPath();

  ctx.arc(
    queen.x,
    queen.y,
    coinRadius+1,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#e9284b";
  ctx.fill();

  ctx.strokeStyle="#7d1229";
  ctx.lineWidth=3;
  ctx.stroke();

}

/* =========================
   STRIKER
========================= */

function drawStriker(){

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    striker.x,
    striker.y,
    strikerRadius,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#eafff1";
  ctx.fill();

  ctx.strokeStyle="#178148";
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    striker.x,
    striker.y,
    7,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="#39ff88";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.restore();

  /* Aim line */

  if(aiming){

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
      striker.x,
      striker.y
    );

    ctx.lineTo(
      aimX,
      aimY
    );

    ctx.strokeStyle="#39ff88";
    ctx.lineWidth=4;

    ctx.setLineDash([10,8]);

    ctx.stroke();

    ctx.setLineDash([]);

    /* Power indicator */

    const dx = striker.x-aimX;
    const dy = striker.y-aimY;

    const power =
      Math.min(
        100,
        Math.hypot(dx,dy)/1.1
      );

    ctx.fillStyle="#07150c";

    ctx.fillRect(
      25,
      SIZE-30,
      180,
      12
    );

    ctx.fillStyle="#39ff88";

    ctx.fillRect(
      25,
      SIZE-30,
      power*1.8,
      12
    );

    ctx.restore();

  }

}

/* =========================
   PARTICLES
========================= */

function particlesBurst(x,y){

  for(let i=0;i<10;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,

      life:1,

      size:Math.random()*4+2

    });

  }

}

function updateParticles(){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vx*=.97;
    p.vy*=.97;

    p.life-=.035;

    if(p.life<=0){

      particles.splice(i,1);

    }

  }

}

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=p.life;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#39ff88";
    ctx.fill();

  });

  ctx.globalAlpha=1;

}

/* =========================
   PHYSICS
========================= */

function physics(obj){

  if(!obj.active)return;

  obj.x += obj.vx;
  obj.y += obj.vy;

  /* Friction */

  obj.vx *= .992;
  obj.vy *= .992;

  if(Math.abs(obj.vx)<.025)
    obj.vx=0;

  if(Math.abs(obj.vy)<.025)
    obj.vy=0;

  /* Walls */

  if(obj.x < playLeft){

    obj.x=playLeft;

    obj.vx=
      Math.abs(obj.vx)*.88;
  }

  if(obj.x > playRight){

    obj.x=playRight;

    obj.vx=
      -Math.abs(obj.vx)*.88;
  }

  if(obj.y < playTop){

    obj.y=playTop;

    obj.vy=
      Math.abs(obj.vy)*.88;
  }

  if(obj.y > playBottom){

    obj.y=playBottom;

    obj.vy=
      -Math.abs(obj.vy)*.88;
  }

}

/* =========================
   COLLISION
========================= */

function collide(a,b,r1,r2){

  if(!a.active || !b.active)
    return;

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  const dist=Math.hypot(dx,dy);

  const minDist=r1+r2;

  if(dist===0 || dist>=minDist)
    return;

  const nx=dx/dist;
  const ny=dy/dist;

  /* Separate */

  const overlap=minDist-dist;

  a.x -= nx*overlap*.51;
  a.y -= ny*overlap*.51;

  b.x += nx*overlap*.51;
  b.y += ny*overlap*.51;

  /* Relative velocity */

  const rvx=b.vx-a.vx;
  const rvy=b.vy-a.vy;

  const velocity =
    rvx*nx+
    rvy*ny;

  if(velocity>0)
    return;

  /* Elastic impulse */

  const restitution=.92;

  const impulse =
    -(1+restitution)*velocity/2;

  const ix=impulse*nx;
  const iy=impulse*ny;

  a.vx -= ix;
  a.vy -= iy;

  b.vx += ix;
  b.vy += iy;

}

/* =========================
   POCKET
========================= */

function isPocketed(obj){

  for(const p of pockets){

    if(
      Math.hypot(
        obj.x-p.x,
        obj.y-p.y
      ) < pocketRadius-2
    ){

      return true;

    }

  }

  return false;

}

/* =========================
   UPDATE
========================= */

function update(){

  if(!moving)
    return;

  physics(striker);

  for(const c of coins){

    if(!c.active)
      continue;

    physics(c);

  }

  if(queen.active)
    physics(queen);

  /*
    Striker ↔ coins
  */

  for(const c of coins){

    if(c.active){

      collide(
        striker,
        c,
        strikerRadius,
        coinRadius
      );

    }

  }

  /*
    Coin ↔ coin
  */

  for(let i=0;i<coins.length;i++){

    for(let j=i+1;j<coins.length;j++){

      if(
        coins[i].active &&
        coins[j].active
      ){

        collide(
          coins[i],
          coins[j],
          coinRadius,
          coinRadius
        );

      }

    }

  }

  /*
    Queen collisions
  */

  if(queen.active){

    collide(
      striker,
      queen,
      strikerRadius,
      coinRadius
    );

    for(const c of coins){

      if(c.active){

        collide(
          queen,
          c,
          coinRadius,
          coinRadius
        );

      }

    }

  }

  /*
    Pocket coins
  */

  for(const c of coins){

    if(
      c.active &&
      isPocketed(c)
    ){

      c.active=false;

      c.vx=0;
      c.vy=0;

      score+=10;

      particlesBurst(
        c.x,
        c.y
      );

      updateScore();

    }

  }

  /*
    Queen pocket
  */

  if(
    queen.active &&
    isPocketed(queen)
  ){

    queen.active=false;

    score+=25;

    particlesBurst(
      queen.x,
      queen.y
    );

    updateScore();

  }

  /*
    Striker pocket
  */

  if(isPocketed(striker)){

    striker.x=SIZE/2;
    striker.y=playBottom-8;

    striker.vx=0;
    striker.vy=0;

  }

  updateParticles();

  /*
    Stop when everything settles
  */

  let movingSomething=false;

  if(
    Math.abs(striker.vx)>.03 ||
    Math.abs(striker.vy)>.03
  ){

    movingSomething=true;

  }

  for(const c of coins){

    if(
      c.active &&
      (
        Math.abs(c.vx)>.03 ||
        Math.abs(c.vy)>.03
      )
    ){

      movingSomething=true;

    }

  }

  if(queen.active){

    if(
      Math.abs(queen.vx)>.03 ||
      Math.abs(queen.vy)>.03
    ){

      movingSomething=true;

    }

  }

  if(!movingSomething){

    striker.vx=0;
    striker.vy=0;

    for(const c of coins){

      c.vx=0;
      c.vy=0;

    }

    if(queen.active){

      queen.vx=0;
      queen.vy=0;

    }

    moving=false;

  }

}

/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    SIZE,
    SIZE
  );

  drawBoard();

  for(const c of coins)
    drawCoin(c);

  drawQueen();

  drawStriker();

  drawParticles();

}

/* =========================
   GAME LOOP
========================= */

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);

}

/* =========================
   STRIKER POSITION
========================= */

function moveStriker(direction){

  if(moving || aiming)
    return;

  striker.x += direction*30;

  const minX=playLeft+60;
  const maxX=playRight-60;

  striker.x=Math.max(
    minX,
    Math.min(maxX,striker.x)
  );

}

/* =========================
   POINTER
========================= */

function getPointer(e){

  const rect=
    canvas.getBoundingClientRect();

  return {

    x:
      (e.clientX-rect.left)*
      SIZE/rect.width,

    y:
      (e.clientY-rect.top)*
      SIZE/rect.height

  };

}

/* START AIMING */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(moving)
      return;

    const p=getPointer(e);

    const d=Math.hypot(
      p.x-striker.x,
      p.y-striker.y
    );

    if(d<45){

      aiming=true;

      aimX=p.x;
      aimY=p.y;

      canvas.setPointerCapture(
        e.pointerId
      );

    }

  }
);

/* DRAG */

canvas.addEventListener(
  "pointermove",
  function(e){

    if(!aiming)
      return;

    const p=getPointer(e);

    let dx=p.x-striker.x;
    let dy=p.y-striker.y;

    let len=Math.hypot(dx,dy);

    const maxPull=150;

    if(len>maxPull){

      dx=dx/len*maxPull;
      dy=dy/len*maxPull;

    }

    aimX=striker.x+dx;
    aimY=striker.y+dy;

  }
);

/* RELEASE */

canvas.addEventListener(
  "pointerup",
  function(e){

    if(!aiming)
      return;

    aiming=false;

    const dx=striker.x-aimX;
    const dy=striker.y-aimY;

    const distance=Math.hypot(
      dx,
      dy
    );

    if(distance<8)
      return;

    const power=Math.min(
      20,
      distance/8
    );

    const length=Math.hypot(
      dx,
      dy
    );

    striker.vx=
      dx/length*power;

    striker.vy=
      dy/length*power;

    moving=true;

  }
);

/* CANCEL AIM */

canvas.addEventListener(
  "pointercancel",
  function(){

    aiming=false;

  }
);

newGame();

loop();

</script>

</body>
</html>
