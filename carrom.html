<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NipamVerse Carrom Easy & Fun</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  margin:7px 0 3px;
  color:#39ff88;
  font-size:24px;
}

#info{
  display:flex;
  justify-content:center;
  gap:25px;
  font-size:16px;
  margin:3px;
}

#turn{
  color:#39ff88;
  font-weight:bold;
  margin-bottom:4px;
}

canvas{
  display:block;
  margin:auto;
  width:min(96vw,700px);
  height:min(76vh,700px);
  background:#a86b38;
  border:5px solid #222;
  border-radius:12px;
  touch-action:none;
}

.controls{
  margin-top:6px;
  display:flex;
  justify-content:center;
  gap:8px;
}

button{
  background:#111;
  color:#39ff88;
  border:2px solid #39ff88;
  border-radius:8px;
  padding:8px 14px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🏆 CARROM EASY & FUN</h1>

<div id="info">
  <span>Player 1: <b id="p1">0</b></span>
  <span>Player 2: <b id="p2">0</b></span>
</div>

<div id="turn">Player 1 Turn</div>

<canvas id="game" width="700" height="700"></canvas>

<div class="controls">
  <button onclick="moveLeft()">⬅ LEFT</button>
  <button onclick="newGame()">NEW GAME</button>
  <button onclick="moveRight()">RIGHT ➡</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=700;
const H=700;

/* THICKER PIECES */
const coinR=15;
const strikerR=20;

/* BIG POCKETS */
const pocketR=34;

/* PLAY AREA */
const BOARD_MIN=58;
const BOARD_MAX=642;

let player=1;

let scores={
  1:0,
  2:0
};

let striker={
  x:350,
  y:625,
  vx:0,
  vy:0
};

let coins=[];

let aiming=false;
let moving=false;

let aimX=350;
let aimY=525;

let pocketedThisShot=0;
let strikerFoul=false;
let finishing=false;


/* PLAYER BASELINES */

const baseY={
  1:625,
  2:75
};


/* POCKET POSITIONS */

const pockets=[
  {x:35,y:35},
  {x:665,y:35},
  {x:35,y:665},
  {x:665,y:665}
];


/* ==================================
   CREATE COINS
================================== */

function createCoins(){

  coins=[];

  const cx=350;
  const cy=350;

  /* QUEEN */

  coins.push({
    x:cx,
    y:cy,
    vx:0,
    vy:0,
    color:"#e53935",
    queen:true,
    pocketed:false
  });


  const colors=["#171717","#f5f5f5"];


  /* INNER RING */

  for(let i=0;i<8;i++){

    const a=i*Math.PI*2/8;

    coins.push({
      x:cx+32*Math.cos(a),
      y:cy+32*Math.sin(a),
      vx:0,
      vy:0,
      color:colors[i%2],
      queen:false,
      pocketed:false
    });
  }


  /* OUTER RING */

  for(let i=0;i<8;i++){

    const a=i*Math.PI*2/8+Math.PI/8;

    coins.push({
      x:cx+62*Math.cos(a),
      y:cy+62*Math.sin(a),
      vx:0,
      vy:0,
      color:colors[i%2],
      queen:false,
      pocketed:false
    });
  }
}


/* ==================================
   RESET STRIKER
================================== */

function resetStriker(){

  striker.x=350;
  striker.y=baseY[player];

  striker.vx=0;
  striker.vy=0;

  aimX=striker.x;
  aimY=striker.y-120;
}


/* ==================================
   CHECK WHETHER POINT IS NEAR POCKET
================================== */

function nearPocket(x,y){

  for(const p of pockets){

    if(Math.hypot(x-p.x,y-p.y)<pocketR+8){
      return true;
    }
  }

  return false;
}


/* ==================================
   DRAW BOARD
================================== */

function drawBoard(){

  ctx.clearRect(0,0,W,H);

  /* WOOD */

  ctx.fillStyle="#a86b38";
  ctx.fillRect(0,0,W,H);

  /* PLAYING AREA */

  ctx.fillStyle="#e0aa69";
  ctx.fillRect(45,45,610,610);


  /* OUTER BORDER */

  ctx.strokeStyle="#542b18";
  ctx.lineWidth=8;
  ctx.strokeRect(45,45,610,610);


  /* CENTER CIRCLE */

  ctx.beginPath();
  ctx.arc(350,350,75,0,Math.PI*2);

  ctx.strokeStyle="#7c3f20";
  ctx.lineWidth=3;
  ctx.stroke();


  ctx.beginPath();
  ctx.arc(350,350,13,0,Math.PI*2);

  ctx.fillStyle="#7c3f20";
  ctx.fill();


  /* CENTER LINES */

  ctx.beginPath();
  ctx.moveTo(275,350);
  ctx.lineTo(425,350);
  ctx.stroke();


  ctx.beginPath();
  ctx.moveTo(350,275);
  ctx.lineTo(350,425);
  ctx.stroke();


  /* BASELINES */

  ctx.strokeStyle="#803e20";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(145,625);
  ctx.lineTo(555,625);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(145,75);
  ctx.lineTo(555,75);
  ctx.stroke();


  /* POCKETS */

  for(const p of pockets){

    ctx.beginPath();
    ctx.arc(p.x,p.y,pocketR,0,Math.PI*2);

    ctx.fillStyle="#080808";
    ctx.fill();

    ctx.strokeStyle="#30170d";
    ctx.lineWidth=3;
    ctx.stroke();
  }
}


/* ==================================
   DRAW COINS
================================== */

function drawCoins(){

  for(const c of coins){

    if(c.pocketed) continue;

    ctx.beginPath();
    ctx.arc(c.x,c.y,coinR,0,Math.PI*2);

    ctx.fillStyle=c.color;
    ctx.fill();

    ctx.strokeStyle="#222";
    ctx.lineWidth=2;
    ctx.stroke();


    if(c.queen){

      ctx.beginPath();
      ctx.arc(c.x,c.y,5,0,Math.PI*2);

      ctx.fillStyle="#fff";
      ctx.fill();
    }
  }
}


/* ==================================
   DRAW STRIKER
================================== */

function drawStriker(){

  ctx.beginPath();
  ctx.arc(
    striker.x,
    striker.y,
    strikerR,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#39ff88";
  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.stroke();
}


/* ==================================
   DOTTED AIM LINE
================================== */

function drawAimLine(){

  if(!aiming || moving) return;


  let dx=aimX-striker.x;
  let dy=aimY-striker.y;

  let d=Math.hypot(dx,dy);

  if(d<5) return;


  /* REVERSE DIRECTION = SHOT DIRECTION */

  let nx=-dx/d;
  let ny=-dy/d;


  ctx.save();

  ctx.fillStyle="#fff";


  /*
     LONG DOTTED GUIDE
  */

  for(let i=20;i<380;i+=18){

    const x=striker.x+nx*i;
    const y=striker.y+ny*i;


    /* stop near board edge */

    if(
      x<52 ||
      x>648 ||
      y<52 ||
      y>648
    ){
      break;
    }


    /* stop at pocket area */

    if(nearPocket(x,y)){
      break;
    }


    ctx.beginPath();
    ctx.arc(x,y,3.2,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}


/* ==================================
   DRAW
================================== */

function draw(){

  drawBoard();
  drawCoins();
  drawAimLine();
  drawStriker();

  requestAnimationFrame(draw);
}


/* ==================================
   DISTANCE
================================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


/* ==================================
   POCKET DETECTION
================================== */

function checkPocket(obj,isStriker=false){

  for(const p of pockets){

    const d=Math.hypot(
      obj.x-p.x,
      obj.y-p.y
    );


    /*
       IMPORTANT FIX:

       Pocket detection happens BEFORE
       wall collision.

       Once the coin reaches the pocket
       zone, it is immediately pocketed.
    */

    if(d < pocketR+coinR*0.55){

      if(isStriker){

        strikerFoul=true;

        striker.x=p.x;
        striker.y=p.y;

        striker.vx=0;
        striker.vy=0;

        return true;
      }


      if(obj.pocketed)
        return true;


      obj.pocketed=true;

      obj.x=p.x;
      obj.y=p.y;

      obj.vx=0;
      obj.vy=0;

      pocketedThisShot++;


      /* SCORE */

      if(obj.queen){
        scores[player]+=3;
      }
      else{
        scores[player]+=1;
      }

      updateScore();

      return true;
    }
  }

  return false;
}


/* ==================================
   WALL BOUNCE
================================== */

function bounce(obj){

  /*
     VERY IMPORTANT:

     Never bounce an object if it is
     already inside a pocket zone.
  */

  if(nearPocket(obj.x,obj.y))
    return;


  const min=BOARD_MIN;
  const max=BOARD_MAX;


  if(obj.x<min){

    obj.x=min;
    obj.vx=Math.abs(obj.vx)*0.92;
  }


  if(obj.x>max){

    obj.x=max;
    obj.vx=-Math.abs(obj.vx)*0.92;
  }


  if(obj.y<min){

    obj.y=min;
    obj.vy=Math.abs(obj.vy)*0.92;
  }


  if(obj.y>max){

    obj.y=max;
    obj.vy=-Math.abs(obj.vy)*0.92;
  }
}


/* ==================================
   COLLISION
================================== */

function collide(a,b){

  if(a.pocketed || b.pocketed)
    return;


  let dx=b.x-a.x;
  let dy=b.y-a.y;

  let d=Math.hypot(dx,dy);

  const minD=coinR*2;


  if(d===0)
    d=0.01;


  if(d<minD){

    const nx=dx/d;
    const ny=dy/d;

    const overlap=minD-d;


    a.x-=nx*overlap/2;
    a.y-=ny*overlap/2;

    b.x+=nx*overlap/2;
    b.y+=ny*overlap/2;


    const rvx=b.vx-a.vx;
    const rvy=b.vy-a.vy;

    const vel=rvx*nx+rvy*ny;


    if(vel>0)
      return;


    /*
       EASY COLLISION
    */

    const impulse=-vel*1.18;


    a.vx-=impulse*nx;
    a.vy-=impulse*ny;

    b.vx+=impulse*nx;
    b.vy+=impulse*ny;
  }
}


/* ==================================
   UPDATE GAME
================================== */

function update(){

  let anyMoving=false;


  /* STRIKER */

  if(
    Math.abs(striker.vx)>0.05 ||
    Math.abs(striker.vy)>0.05
  ){
    anyMoving=true;
  }


  striker.x+=striker.vx;
  striker.y+=striker.vy;


  striker.vx*=0.992;
  striker.vy*=0.992;


  if(Math.abs(striker.vx)<0.05)
    striker.vx=0;

  if(Math.abs(striker.vy)<0.05)
    striker.vy=0;


  /*
     POCKET FIRST
  */

  if(!checkPocket(striker,true)){

    if(!strikerFoul)
      bounce(striker);
  }


  /* COINS */

  for(const c of coins){

    if(c.pocketed)
      continue;


    if(
      Math.abs(c.vx)>0.05 ||
      Math.abs(c.vy)>0.05
    ){
      anyMoving=true;
    }


    c.x+=c.vx;
    c.y+=c.vy;


    c.vx*=0.992;
    c.vy*=0.992;


    if(Math.abs(c.vx)<0.05)
      c.vx=0;

    if(Math.abs(c.vy)<0.05)
      c.vy=0;


    /*
       POCKET FIRST.
       If pocketed, NEVER call bounce().
    */

    if(checkPocket(c,false))
      continue;


    bounce(c);
  }


  /* STRIKER → COINS */

  for(const c of coins){

    if(!c.pocketed){

      collide(striker,c);
    }
  }


  /* COIN → COIN */

  for(let i=0;i<coins.length;i++){

    if(coins[i].pocketed)
      continue;


    for(let j=i+1;j<coins.length;j++){

      if(coins[j].pocketed)
        continue;


      collide(
        coins[i],
        coins[j]
      );
    }
  }


  /* SHOT FINISHED */

  if(
    moving &&
    !anyMoving &&
    striker.vx===0 &&
    striker.vy===0
  ){

    moving=false;

    finishShot();
  }


  requestAnimationFrame(update);
}


/* ==================================
   FINISH SHOT
================================== */

function finishShot(){

  if(finishing)
    return;


  finishing=true;


  setTimeout(()=>{

    /*
       COIN POCKETED:
       SAME PLAYER

       MISS:
       NEXT PLAYER

       STRIKER FOUL:
       NEXT PLAYER
    */

    if(
      pocketedThisShot===0 ||
      strikerFoul
    ){

      player=
        player===1
        ?2
        :1;
    }


    pocketedThisShot=0;
    strikerFoul=false;


    resetStriker();

    updateTurn();


    finishing=false;

  },400);
}


/* ==================================
   SHOOT
================================== */

function shoot(){

  if(moving)
    return;


  const dx=striker.x-aimX;
  const dy=striker.y-aimY;

  const d=Math.hypot(dx,dy);


  if(d<10)
    return;


  /*
     EASY + POWERFUL
  */

  const power=Math.min(
    32,
    Math.max(13,d*0.24)
  );


  striker.vx=(dx/d)*power;
  striker.vy=(dy/d)*power;


  moving=true;
}


/* ==================================
   POINTER DOWN
================================== */

canvas.addEventListener(
  "pointerdown",
  e=>{

    if(moving)
      return;


    const r=
      canvas.getBoundingClientRect();


    const x=
      (e.clientX-r.left)*W/r.width;

    const y=
      (e.clientY-r.top)*H/r.height;


    if(
      Math.hypot(
        x-striker.x,
        y-striker.y
      )<65
    ){

      aiming=true;

      aimX=x;
      aimY=y;


      canvas.setPointerCapture(
        e.pointerId
      );
    }
  }
);


/* ==================================
   POINTER MOVE
================================== */

canvas.addEventListener(
  "pointermove",
  e=>{

    if(!aiming)
      return;


    const r=
      canvas.getBoundingClientRect();


    let x=
      (e.clientX-r.left)*W/r.width;

    let y=
      (e.clientY-r.top)*H/r.height;


    let dx=x-striker.x;
    let dy=y-striker.y;

    let d=Math.hypot(dx,dy);


    /*
       LIMIT PULL
    */

    if(d>170){

      dx=dx/d*170;
      dy=dy/d*170;

      x=striker.x+dx;
      y=striker.y+dy;
    }


    aimX=x;
    aimY=y;
  }
);


/* ==================================
   POINTER UP
================================== */

canvas.addEventListener(
  "pointerup",
  e=>{

    if(!aiming)
      return;


    aiming=false;

    shoot();
  }
);


/* ==================================
   LEFT
================================== */

function moveLeft(){

  if(moving)
    return;


  striker.x-=25;


  if(striker.x<175)
    striker.x=175;


  aimX=striker.x;
  aimY=striker.y-120;
}


/* ==================================
   RIGHT
================================== */

function moveRight(){

  if(moving)
    return;


  striker.x+=25;


  if(striker.x>525)
    striker.x=525;


  aimX=striker.x;
  aimY=striker.y-120;
}


/* ==================================
   SCORE
================================== */

function updateScore(){

  document.getElementById("p1")
    .textContent=scores[1];

  document.getElementById("p2")
    .textContent=scores[2];
}


/* ==================================
   TURN
================================== */

function updateTurn(){

  document.getElementById("turn")
    .textContent=
      "Player "+player+" Turn";
}


/* ==================================
   NEW GAME
================================== */

function newGame(){

  player=1;


  scores={
    1:0,
    2:0
  };


  pocketedThisShot=0;

  strikerFoul=false;

  moving=false;

  aiming=false;

  finishing=false;


  createCoins();

  resetStriker();

  updateScore();

  updateTurn();
}


/* ==================================
   START
================================== */

createCoins();

resetStriker();

updateScore();

updateTurn();

draw();

update();

</script>

</body>
</html>
