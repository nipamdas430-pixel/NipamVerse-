<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>NipamVerse Carrom Pool</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:10px 0 4px;
    color:#39ff88;
    font-size:25px;
}

#info{
    display:flex;
    justify-content:center;
    gap:25px;
    font-size:17px;
    margin-bottom:6px;
}

#turn{
    color:#39ff88;
    font-weight:bold;
}

canvas{
    background:#8b552d;
    display:block;
    margin:auto;
    border:5px solid #222;
    border-radius:10px;
    max-width:96vw;
    max-height:78vh;
    touch-action:none;
}

.controls{
    margin-top:7px;
    display:flex;
    justify-content:center;
    gap:10px;
}

button{
    background:#111;
    color:#39ff88;
    border:2px solid #39ff88;
    border-radius:8px;
    padding:9px 17px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🏆 CARROM POOL</h1>

<div id="info">
    <span>Player 1: <b id="p1">0</b></span>
    <span>Player 2: <b id="p2">0</b></span>
</div>

<div id="turn">Player 1 Turn</div>

<canvas id="game" width="700" height="700"></canvas>

<div class="controls">
    <button onclick="moveLeft()">⬅ LEFT</button>
    <button onclick="newGame()">NEW GAME</button>
    <button onclick="moveRight()">RIGHT ➡</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=700;
const H=700;

const pocketRadius=25;
const coinRadius=11;
const strikerRadius=15;

let player=1;

let scores={
    1:0,
    2:0
};

let striker={
    x:350,
    y:625,
    vx:0,
    vy:0
};

let coins=[];
let aiming=false;
let moving=false;

let shotPocketed=0;
let strikerFoul=false;
let shotFinished=false;

const baseY={
    1:625,
    2:75
};

const pockets=[
    {x:35,y:35},
    {x:665,y:35},
    {x:35,y:665},
    {x:665,y:665}
];


/* =========================
   CREATE COINS
========================= */

function createCoins(){

    coins=[];

    const cx=350;
    const cy=350;

    coins.push({
        x:cx,
        y:cy,
        vx:0,
        vy:0,
        color:"#e33",
        queen:true,
        pocketed:false
    });

    const colors=["#111","#f5f5f5"];

    let index=0;

    for(let i=0;i<8;i++){

        const angle=(Math.PI*2/8)*i;

        const x=cx+27*Math.cos(angle);
        const y=cy+27*Math.sin(angle);

        coins.push({
            x:x,
            y:y,
            vx:0,
            vy:0,
            color:colors[index%2],
            queen:false,
            pocketed:false
        });

        index++;
    }

    for(let i=0;i<8;i++){

        const angle=(Math.PI*2/8)*i+Math.PI/8;

        const x=cx+54*Math.cos(angle);
        const y=cy+54*Math.sin(angle);

        coins.push({
            x:x,
            y:y,
            vx:0,
            vy:0,
            color:colors[index%2],
            queen:false,
            pocketed:false
        });

        index++;
    }
}


/* =========================
   STRIKER
========================= */

function resetStriker(){

    striker.x=350;
    striker.y=baseY[player];

    striker.vx=0;
    striker.vy=0;
}


/* =========================
   DRAW BOARD
========================= */

function drawBoard(){

    ctx.clearRect(0,0,W,H);

    /* wooden board */

    ctx.fillStyle="#a86b38";
    ctx.fillRect(0,0,W,H);

    /* inner board */

    ctx.fillStyle="#d9a15f";
    ctx.fillRect(45,45,610,610);

    /* borders */

    ctx.strokeStyle="#4b2412";
    ctx.lineWidth=8;

    ctx.strokeRect(45,45,610,610);

    /* center circle */

    ctx.beginPath();
    ctx.arc(350,350,70,0,Math.PI*2);
    ctx.strokeStyle="#7b3d20";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(350,350,12,0,Math.PI*2);
    ctx.fillStyle="#7b3d20";
    ctx.fill();

    /* center lines */

    ctx.strokeStyle="#7b3d20";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(280,350);
    ctx.lineTo(420,350);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(350,280);
    ctx.lineTo(350,420);
    ctx.stroke();

    /* pockets */

    for(const p of pockets){

        ctx.beginPath();
        ctx.arc(p.x,p.y,pocketRadius,0,Math.PI*2);

        ctx.fillStyle="#111";
        ctx.fill();

        ctx.strokeStyle="#000";
        ctx.lineWidth=3;
        ctx.stroke();
    }

    /* baselines */

    ctx.strokeStyle="#8b3f20";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(150,baseY[1]);
    ctx.lineTo(550,baseY[1]);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(150,baseY[2]);
    ctx.lineTo(550,baseY[2]);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(350,baseY[1],18,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(350,baseY[2],18,0,Math.PI*2);
    ctx.stroke();
}


/* =========================
   DRAW COINS
========================= */

function drawCoins(){

    for(const c of coins){

        if(c.pocketed) continue;

        ctx.beginPath();
        ctx.arc(c.x,c.y,coinRadius,0,Math.PI*2);

        ctx.fillStyle=c.color;
        ctx.fill();

        ctx.strokeStyle="#222";
        ctx.lineWidth=2;
        ctx.stroke();

        if(c.queen){

            ctx.beginPath();
            ctx.arc(c.x,c.y,4,0,Math.PI*2);
            ctx.fillStyle="#fff";
            ctx.fill();
        }
    }
}


/* =========================
   DRAW STRIKER
========================= */

function drawStriker(){

    ctx.beginPath();
    ctx.arc(
        striker.x,
        striker.y,
        strikerRadius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#39ff88";
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.stroke();
}


/* =========================
   DRAW AIM
========================= */

let aimX=350;
let aimY=baseY[1];

function drawAim(){

    if(!aiming) return;

    ctx.beginPath();

    ctx.moveTo(
        striker.x,
        striker.y
    );

    ctx.lineTo(
        aimX,
        aimY
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.setLineDash([8,8]);
    ctx.stroke();
    ctx.setLineDash([]);
}


/* =========================
   DRAW
========================= */

function draw(){

    drawBoard();
    drawCoins();
    drawStriker();
    drawAim();

    requestAnimationFrame(draw);
}


/* =========================
   DISTANCE
========================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =========================
   POCKET CHECK
========================= */

function checkPocket(obj,isStriker=false){

    for(const p of pockets){

        if(distance(obj,p)<pocketRadius){

            if(isStriker){

                if(!strikerFoul){

                    strikerFoul=true;
                    obj.vx=0;
                    obj.vy=0;

                }

                return true;
            }

            if(obj.pocketed) return true;

            obj.pocketed=true;
            obj.vx=0;
            obj.vy=0;

            shotPocketed++;

            if(obj.queen){

                scores[player]+=3;

            }else{

                scores[player]+=1;
            }

            updateScore();

            return true;
        }
    }

    return false;
}


/* =========================
   WALL COLLISION
========================= */

function wallBounce(obj){

    const min=58;
    const max=642;

    if(obj.x<min){

        obj.x=min;
        obj.vx=Math.abs(obj.vx)*0.85;
    }

    if(obj.x>max){

        obj.x=max;
        obj.vx=-Math.abs(obj.vx)*0.85;
    }

    if(obj.y<min){

        obj.y=min;
        obj.vy=Math.abs(obj.vy)*0.85;
    }

    if(obj.y>max){

        obj.y=max;
        obj.vy=-Math.abs(obj.vy)*0.85;
    }
}


/* =========================
   COIN COLLISION
========================= */

function collide(a,b){

    if(a.pocketed || b.pocketed) return;

    let dx=b.x-a.x;
    let dy=b.y-a.y;

    let d=Math.hypot(dx,dy);

    const minDist=coinRadius*2;

    if(d===0) d=0.01;

    if(d<minDist){

        const nx=dx/d;
        const ny=dy/d;

        const overlap=minDist-d;

        a.x-=nx*overlap/2;
        a.y-=ny*overlap/2;

        b.x+=nx*overlap/2;
        b.y+=ny*overlap/2;

        const rvx=b.vx-a.vx;
        const rvy=b.vy-a.vy;

        const vel=rvx*nx+rvy*ny;

        if(vel>0) return;

        const impulse=-vel;

        a.vx-=impulse*nx;
        a.vy-=impulse*ny;

        b.vx+=impulse*nx;
        b.vy+=impulse*ny;
    }
}


/* =========================
   UPDATE
========================= */

function update(){

    let anyMoving=false;

    /* striker */

    if(Math.abs(striker.vx)>0.05 ||
       Math.abs(striker.vy)>0.05){

        anyMoving=true;
    }

    striker.x+=striker.vx;
    striker.y+=striker.vy;

    striker.vx*=0.985;
    striker.vy*=0.985;

    if(Math.abs(striker.vx)<0.05) striker.vx=0;
    if(Math.abs(striker.vy)<0.05) striker.vy=0;

    checkPocket(striker,true);

    if(!strikerFoul){

        wallBounce(striker);
    }


    /* coins */

    for(const c of coins){

        if(c.pocketed) continue;

        if(Math.abs(c.vx)>0.05 ||
           Math.abs(c.vy)>0.05){

            anyMoving=true;
        }

        c.x+=c.vx;
        c.y+=c.vy;

        c.vx*=0.985;
        c.vy*=0.985;

        if(Math.abs(c.vx)<0.05) c.vx=0;
        if(Math.abs(c.vy)<0.05) c.vy=0;

        if(checkPocket(c,false)) continue;

        wallBounce(c);
    }


    /* striker → coins */

    for(const c of coins){

        if(c.pocketed) continue;

        collide(striker,c);
    }


    /* coin → coin */

    for(let i=0;i<coins.length;i++){

        for(let j=i+1;j<coins.length;j++){

            collide(
                coins[i],
                coins[j]
            );
        }
    }


    /* shot finished */

    if(moving &&
       !anyMoving &&
       striker.vx===0 &&
       striker.vy===0){

        moving=false;

        finishShot();
    }

    requestAnimationFrame(update);
}


/* =========================
   FINISH SHOT
========================= */

function finishShot(){

    if(shotFinished) return;

    shotFinished=true;

    setTimeout(()=>{

        /*
          IMPORTANT RULE:

          Coin pocketed = SAME PLAYER

          No coin pocketed = NEXT PLAYER

          Striker foul = NEXT PLAYER
        */

        if(shotPocketed>0 && !strikerFoul){

            /* SAME PLAYER */

            player=player;

        }else{

            /* CHANGE PLAYER */

            player =
                player===1
                ? 2
                : 1;
        }

        shotPocketed=0;
        strikerFoul=false;

        resetStriker();

        shotFinished=false;

        updateTurn();

    },300);
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(moving) return;

    let dx=striker.x-aimX;
    let dy=striker.y-aimY;

    let power=Math.hypot(dx,dy);

    if(power<10) return;

    const maxPower=32;

    power=Math.min(power,maxPower);

    striker.vx=(dx/Math.hypot(dx,dy))*power;
    striker.vy=(dy/Math.hypot(dx,dy))*power;

    moving=true;
}


/* =========================
   POINTER CONTROLS
========================= */

canvas.addEventListener("pointerdown",e=>{

    if(moving) return;

    const r=canvas.getBoundingClientRect();

    const x=(e.clientX-r.left)*W/r.width;
    const y=(e.clientY-r.top)*H/r.height;

    if(
        Math.hypot(
            x-striker.x,
            y-striker.y
        )<45
    ){

        aiming=true;
        aimX=x;
        aimY=y;

        canvas.setPointerCapture(e.pointerId);
    }
});


canvas.addEventListener("pointermove",e=>{

    if(!aiming) return;

    const r=canvas.getBoundingClientRect();

    const x=(e.clientX-r.left)*W/r.width;
    const y=(e.clientY-r.top)*H/r.height;

    aimX=x;
    aimY=y;
});


canvas.addEventListener("pointerup",e=>{

    if(!aiming) return;

    aiming=false;

    shoot();
});


/* =========================
   LEFT / RIGHT
========================= */

function moveLeft(){

    if(moving) return;

    striker.x-=25;

    if(striker.x<170)
        striker.x=170;
}


function moveRight(){

    if(moving) return;

    striker.x+=25;

    if(striker.x>530)
        striker.x=530;
}


/* =========================
   SCORE
========================= */

function updateScore(){

    document.getElementById("p1").textContent=scores[1];
    document.getElementById("p2").textContent=scores[2];
}


/* =========================
   TURN
========================= */

function updateTurn(){

    document.getElementById("turn").textContent=
        "Player "+player+" Turn";
}


/* =========================
   NEW GAME
========================= */

function newGame(){

    player=1;

    scores={
        1:0,
        2:0
    };

    shotPocketed=0;
    strikerFoul=false;
    moving=false;
    aiming=false;
    shotFinished=false;

    createCoins();
    resetStriker();
    updateScore();
    updateTurn();
}


/* =========================
   START
========================= */

createCoins();
resetStriker();
updateScore();
updateTurn();

draw();
update();

</script>

</body>
  </html>
