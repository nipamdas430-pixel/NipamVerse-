<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NipamVerse Carrom 2 Player</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  user-select:none;
  overflow-x:hidden;
}

h1{
  color:#39ff88;
  text-shadow:0 0 15px #39ff88;
  margin:12px 0 6px;
}

#top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:8px;
}

.player{
  padding:7px 12px;
  border-radius:10px;
  background:#111;
}

#p1{
  color:#4c91ff;
}

#p2{
  color:#39ff88;
}

#turn{
  padding:7px 14px;
  border:1px solid #39ff88;
  border-radius:20px;
  font-weight:bold;
}

canvas{
  width:min(94vw,700px);
  height:min(94vw,700px);
  display:block;
  margin:auto;
  border:8px solid #39200e;
  border-radius:8px;
  background:#a96332;
  box-shadow:0 0 25px #16ff70;
  touch-action:none;
}

.controls{
  margin:12px auto;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  padding:12px 18px;
  border-radius:10px;
  border:1px solid #39ff88;
  background:#07130b;
  color:#39ff88;
  font-size:15px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}

#msg{
  min-height:28px;
  font-size:14px;
  color:#ddd;
  padding:4px 10px;
}
</style>
</head>

<body>

<h1>🎯 CARROM MASTER</h1>

<div id="top">

  <div class="player" id="p1">
    🔵 Player 1: <b id="score1">0</b>
  </div>

  <div id="turn">
    Player 1 Turn
  </div>

  <div class="player" id="p2">
    🟢 Player 2: <b id="score2">0</b>
  </div>

</div>

<canvas id="board" width="700" height="700"></canvas>

<div class="controls">
  <button onclick="moveStriker(-35)">⬅ LEFT</button>
  <button onclick="newGame()">🔄 NEW GAME</button>
  <button onclick="moveStriker(35)">RIGHT ➡</button>
</div>

<div id="msg">
  Player 1 — Drag striker backward and release.
</div>

<script>

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const W=700;
const H=700;

let player=1;

let score1=0;
let score2=0;

let aiming=false;
let moving=false;
let gameOver=false;

let shotPocketed=false;
let strikerFoul=false;

let pointer={
  x:350,
  y:625
};

const BASE_Y={
  1:625,
  2:75
};

const striker={
  x:350,
  y:625,
  r:15,
  vx:0,
  vy:0
};

const pockets=[
  {x:55,y:55},
  {x:645,y:55},
  {x:55,y:645},
  {x:645,y:645}
];

let coins=[];
let particles=[];


/* =========================
   CREATE COINS
========================= */

function createCoins(){

  coins=[];

  // Queen
  coins.push({
    x:350,
    y:350,
    r:11,
    type:"queen",
    color:"#e53935",
    vx:0,
    vy:0,
    pocketed:false
  });

  const colors=["#111","#eee"];

  // Inner 6
  for(let i=0;i<6;i++){

    const a=i*Math.PI*2/6;

    coins.push({
      x:350+Math.cos(a)*25,
      y:350+Math.sin(a)*25,
      r:11,
      type:"coin",
      color:colors[i%2],
      vx:0,
      vy:0,
      pocketed:false
    });
  }

  // Outer 12
  for(let i=0;i<12;i++){

    const a=i*Math.PI*2/12;

    coins.push({
      x:350+Math.cos(a)*50,
      y:350+Math.sin(a)*50,
      r:11,
      type:"coin",
      color:colors[(i+1)%2],
      vx:0,
      vy:0,
      pocketed:false
    });
  }
}


/* =========================
   RESET STRIKER
========================= */

function resetStriker(){

  striker.x=350;
  striker.y=BASE_Y[player];

  striker.vx=0;
  striker.vy=0;

  pointer.x=striker.x;
  pointer.y=striker.y;
}


/* =========================
   BOARD
========================= */

function drawBoard(){

  ctx.clearRect(0,0,W,H);

  // Wood
  ctx.fillStyle="#a96332";
  ctx.fillRect(0,0,W,H);

  // Playing area
  ctx.fillStyle="#e7b875";
  ctx.fillRect(35,35,630,630);

  // Border
  ctx.strokeStyle="#542b12";
  ctx.lineWidth=8;
  ctx.strokeRect(35,35,630,630);

  // Pockets
  pockets.forEach(p=>{

    ctx.beginPath();

    ctx.fillStyle="#050505";

    ctx.arc(
      p.x,
      p.y,
      28,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#351a0b";
    ctx.lineWidth=5;
    ctx.stroke();
  });

  // Center
  ctx.beginPath();

  ctx.strokeStyle="#913b20";
  ctx.lineWidth=3;

  ctx.arc(
    350,
    350,
    65,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    350,
    350,
    10,
    0,
    Math.PI*2
  );

  ctx.stroke();


  // Current player's baseline
  ctx.strokeStyle=
    player===1
    ? "#2477ff"
    : "#27d86d";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    120,
    BASE_Y[player]
  );

  ctx.lineTo(
    580,
    BASE_Y[player]
  );

  ctx.stroke();

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    120,
    BASE_Y[player]-18
  );

  ctx.lineTo(
    580,
    BASE_Y[player]-18
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    120,
    BASE_Y[player]+18
  );

  ctx.lineTo(
    580,
    BASE_Y[player]+18
  );

  ctx.stroke();
}


/* =========================
   DRAW COINS
========================= */

function drawCoins(){

  coins.forEach(c=>{

    if(c.pocketed)return;

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      c.r,
      0,
      Math.PI*2
    );

    ctx.fillStyle=c.color;
    ctx.fill();

    ctx.strokeStyle="#777";
    ctx.lineWidth=2;
    ctx.stroke();

    if(c.type==="queen"){

      ctx.fillStyle="#fff";
      ctx.font="bold 11px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";

      ctx.fillText(
        "Q",
        c.x,
        c.y
      );
    }
  });
}


/* =========================
   DRAW STRIKER
========================= */

function drawStriker(){

  ctx.beginPath();

  ctx.arc(
    striker.x,
    striker.y,
    striker.r,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    player===1
    ? "#2477ff"
    : "#27d86d";

  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.stroke();


  if(aiming){

    let dx=
      striker.x-pointer.x;

    let dy=
      striker.y-pointer.y;

    let d=Math.hypot(dx,dy);

    if(d>0){

      dx/=d;
      dy/=d;
    }

    ctx.beginPath();

    ctx.moveTo(
      striker.x,
      striker.y
    );

    ctx.lineTo(
      striker.x+dx*150,
      striker.y+dy*150
    );

    ctx.strokeStyle="#39ff88";
    ctx.lineWidth=2;
    ctx.stroke();
  }
}


/* =========================
   PARTICLES
========================= */

function particle(x,y,color){

  for(let i=0;i<8;i++){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      r:Math.random()*3+1,
      life:1,
      color:color
    });
  }
}

function updateParticles(){

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;

    p.life-=.035;
  });

  particles=
    particles.filter(p=>p.life>0);
}

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=p.life;

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;
  });
}


/* =========================
   POCKET
========================= */

function checkPocket(obj){

  for(const pocket of pockets){

    const d=
      Math.hypot(
        obj.x-pocket.x,
        obj.y-pocket.y
      );

    if(d<30){

      // Striker
      if(obj===striker){

        if(!strikerFoul){

          strikerFoul=true;

          if(player===1){

            score1=Math.max(
              0,
              score1-5
            );

          }else{

            score2=Math.max(
              0,
              score2-5
            );
          }

          updateScore();

          particle(
            obj.x,
            obj.y,
            "#ff4444"
          );
        }

        return;
      }


      // Coin
      if(obj.pocketed)return;

      obj.pocketed=true;

      obj.vx=0;
      obj.vy=0;

      // VERY IMPORTANT:
      // This shot successfully pocketed something.
      shotPocketed=true;

      particle(
        obj.x,
        obj.y,
        obj.color
      );


      if(obj.type==="queen"){

        if(player===1)
          score1+=50;
        else
          score2+=50;

      }else{

        if(player===1)
          score1+=10;
        else
          score2+=10;
      }

      updateScore();

      return;
    }
  }
}


/* =========================
   COLLISION
========================= */

function strikerCoinCollision(c){

  if(c.pocketed)return;

  const dx=c.x-striker.x;
  const dy=c.y-striker.y;

  const d=Math.hypot(dx,dy);

  const min=c.r+striker.r;

  if(d<min && d>0){

    const nx=dx/d;
    const ny=dy/d;

    const speed=
      Math.hypot(
        striker.vx,
        striker.vy
      );

    c.vx=
      nx*speed*.80;

    c.vy=
      ny*speed*.80;

    striker.vx-=
      nx*speed*.25;

    striker.vy-=
      ny*speed*.25;

    c.x=
      striker.x+nx*min;

    c.y=
      striker.y+ny*min;
  }
}


function coinCollision(a,b){

  if(
    a.pocketed ||
    b.pocketed
  )return;

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  const d=Math.hypot(dx,dy);

  const min=a.r+b.r;

  if(d<min && d>0){

    const nx=dx/d;
    const ny=dy/d;

    const overlap=min-d;

    a.x-=nx*overlap/2;
    a.y-=ny*overlap/2;

    b.x+=nx*overlap/2;
    b.y+=ny*overlap/2;

    const avx=a.vx;
    const avy=a.vy;

    a.vx=b.vx*.88;
    a.vy=b.vy*.88;

    b.vx=avx*.88;
    b.vy=avy*.88;
  }
}


/* =========================
   UPDATE
========================= */

function update(){

  if(moving){

    // Striker
    striker.x+=striker.vx;
    striker.y+=striker.vy;

    striker.vx*=.985;
    striker.vy*=.985;


    // Striker walls
    if(striker.x-striker.r<40){

      striker.x=40+striker.r;
      striker.vx*=-.82;
    }

    if(striker.x+striker.r>660){

      striker.x=660-striker.r;
      striker.vx*=-.82;
    }

    if(striker.y-striker.r<40){

      striker.y=40+striker.r;
      striker.vy*=-.82;
    }

    if(striker.y+striker.r>660){

      striker.y=660-striker.r;
      striker.vy*=-.82;
    }


    // Striker hits coins
    coins.forEach(c=>{
      strikerCoinCollision(c);
    });


    // Coins
    coins.forEach(c=>{

      if(c.pocketed)return;

      c.x+=c.vx;
      c.y+=c.vy;

      c.vx*=.985;
      c.vy*=.985;


      if(c.x-c.r<40){

        c.x=40+c.r;
        c.vx*=-.82;
      }

      if(c.x+c.r>660){

        c.x=660-c.r;
        c.vx*=-.82;
      }

      if(c.y-c.r<40){

        c.y=40+c.r;
        c.vy*=-.82;
      }

      if(c.y+c.r>660){

        c.y=660-c.r;
        c.vy*=-.82;
      }

      checkPocket(c);
    });


    // Coin collisions
    for(let i=0;i<coins.length;i++){

      for(
        let j=i+1;
        j<coins.length;
        j++
      ){

        coinCollision(
          coins[i],
          coins[j]
        );
      }
    }


    // Striker pocket
    checkPocket(striker);


    // Are objects still moving?
    const strikerSpeed=
      Math.hypot(
        striker.vx,
        striker.vy
      );

    const coinsMoving=
      coins.some(c=>
        !c.pocketed &&
        Math.hypot(
          c.vx,
          c.vy
        )>.08
      );


    if(
      strikerSpeed<.08 &&
      !coinsMoving
    ){

      striker.vx=0;
      striker.vy=0;

      moving=false;

      endShot();
    }
  }

  updateParticles();

  requestAnimationFrame(update);
}


/* =========================
   END SHOT
========================= */

function endShot(){

  if(checkWinner())
    return;


  /*
  ======================================
  CARROM TURN RULE
  ======================================

  SUCCESS:
  Coin/Queen pocketed
       ↓
  SAME PLAYER

  MISS:
  Nothing pocketed
       ↓
  OTHER PLAYER

  STRIKER FOUL:
  Striker pocketed
       ↓
  OTHER PLAYER
  ======================================
  */


  if(
    shotPocketed &&
    !strikerFoul
  ){

    // SAME PLAYER CONTINUES
    resetStriker();

    document.getElementById("msg").textContent=
      "🔥 Coin pocketed! Player "+
      player+
      " continues!";

    shotPocketed=false;
    strikerFoul=false;

    updateTurn();

    return;
  }


  // MISS OR FOUL
  player=
    player===1
    ? 2
    : 1;

  resetStriker();

  shotPocketed=false;
  strikerFoul=false;

  updateTurn();

  document.getElementById("msg").textContent=
    "Player "+player+
    " — Your turn! 🎯";
}


/* =========================
   WINNER
========================= */

function checkWinner(){

  const remaining=
    coins.filter(
      c=>!c.pocketed
    ).length;

  if(remaining===0){

    gameOver=true;

    if(score1>score2){

      document.getElementById("turn").textContent=
        "🏆 PLAYER 1 WINS";

      document.getElementById("msg").textContent=
        "Player 1 wins! 🔥";

    }else if(score2>score1){

      document.getElementById("turn").textContent=
        "🏆 PLAYER 2 WINS";

      document.getElementById("msg").textContent=
        "Player 2 wins! 🔥";

    }else{

      document.getElementById("turn").textContent=
        "🤝 DRAW";

      document.getElementById("msg").textContent=
        "It's a draw!";
    }

    return true;
  }

  return false;
}


/* =========================
   SCORE
========================= */

function updateScore(){

  document.getElementById("score1")
    .textContent=score1;

  document.getElementById("score2")
    .textContent=score2;
}


/* =========================
   TURN DISPLAY
========================= */

function updateTurn(){

  document.getElementById("turn").textContent=
    "Player "+player+
    " Turn";
}


/* =========================
   POINTER POSITION
========================= */

function getPointer(e){

  const rect=
    canvas.getBoundingClientRect();

  return {

    x:
      (e.clientX-rect.left)*
      (W/rect.width),

    y:
      (e.clientY-rect.top)*
      (H/rect.height)
  };
}


/* =========================
   POINTER DOWN
========================= */

canvas.addEventListener(
  "pointerdown",
  e=>{

    if(moving || gameOver)
      return;

    const p=getPointer(e);

    const d=
      Math.hypot(
        p.x-striker.x,
        p.y-striker.y
      );

    if(d<50){

      aiming=true;

      pointer=p;

      canvas.setPointerCapture(
        e.pointerId
      );
    }
  }
);


/* =========================
   POINTER MOVE
========================= */

canvas.addEventListener(
  "pointermove",
  e=>{

    if(!aiming)
      return;

    const p=getPointer(e);

    let dx=p.x-striker.x;
    let dy=p.y-striker.y;

    let d=Math.hypot(dx,dy);

    // Maximum pull
    if(d>120){

      dx=dx/d*120;
      dy=dy/d*120;

      p.x=
        striker.x+dx;

      p.y=
        striker.y+dy;
    }

    pointer=p;
  }
);


/* =========================
   SHOOT
========================= */

canvas.addEventListener(
  "pointerup",
  e=>{

    if(!aiming)
      return;

    aiming=false;

    const dx=
      striker.x-pointer.x;

    const dy=
      striker.y-pointer.y;

    const power=
      Math.hypot(dx,dy);

    if(power<12)
      return;

    const d=
      Math.hypot(dx,dy);

    const speed=
      Math.min(
        power*.17,
        23
      );

    striker.vx=
      dx/d*speed;

    striker.vy=
      dy/d*speed;

    // Reset shot status
    shotPocketed=false;
    strikerFoul=false;

    moving=true;

    document.getElementById("msg").textContent=
      "🎯 Shot taken!";
  }
);


/* =========================
   MOVE STRIKER
========================= */

function moveStriker(amount){

  if(moving || gameOver)
    return;

  striker.x+=amount;

  if(striker.x<125)
    striker.x=125;

  if(striker.x>575)
    striker.x=575;
}


/* =========================
   NEW GAME
========================= */

function newGame(){

  player=1;

  score1=0;
  score2=0;

  aiming=false;
  moving=false;
  gameOver=false;

  shotPocketed=false;
  strikerFoul=false;

  particles=[];

  createCoins();

  resetStriker();

  updateScore();
  updateTurn();

  document.getElementById("msg").textContent=
    "Player 1 — Drag striker backward and release.";
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft"){

      moveStriker(-20);
    }

    if(e.key==="ArrowRight"){

      moveStriker(20);
    }

    if(
      e.key==="r" ||
      e.key==="R"
    ){

      newGame();
    }
  }
);


/* =========================
   DRAW LOOP
========================= */

function draw(){

  drawBoard();
  drawCoins();
  drawStriker();
  drawParticles();

  requestAnimationFrame(draw);
}


/* =========================
   START
========================= */

createCoins();

resetStriker();

updateScore();
updateTurn();

draw();
update();

</script>

</body>
  </html>
