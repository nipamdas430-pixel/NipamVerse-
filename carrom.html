<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NipamVerse Carrom 2 Player</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  user-select:none;
}
h1{
  margin:12px 0 5px;
  color:#39ff88;
  text-shadow:0 0 15px #39ff88;
}
#info{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
  margin:8px;
  font-size:18px;
}
#turn{
  color:#39ff88;
  font-weight:bold;
}
canvas{
  width:min(94vw,700px);
  height:min(94vw,700px);
  max-width:700px;
  max-height:700px;
  background:#9b5a28;
  border:8px solid #39200e;
  border-radius:8px;
  box-shadow:0 0 25px #16ff70;
  touch-action:none;
}
.controls{
  margin:12px auto;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
button{
  padding:12px 22px;
  border:1px solid #39ff88;
  border-radius:10px;
  background:#07130b;
  color:#39ff88;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 0 10px #123;
}
button:active{
  transform:scale(.95);
  background:#12351e;
}
#message{
  min-height:25px;
  color:#ddd;
  font-size:14px;
  padding:5px;
}
</style>
</head>

<body>

<h1>🎯 CARROM MASTER</h1>

<div id="info">
  <span>🔵 Player 1: <b id="score1">0</b></span>
  <span>🟢 Player 2: <b id="score2">0</b></span>
  <span id="turn">Player 1 Turn</span>
</div>

<canvas id="game" width="700" height="700"></canvas>

<div class="controls">
  <button id="left">⬅ LEFT</button>
  <button id="new">🔄 NEW GAME</button>
  <button id="right">RIGHT ➡</button>
</div>

<div id="message">Drag the striker backward and release to shoot.</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=700,H=700;
const center={x:350,y:350};

let player=1;
let score1=0;
let score2=0;
let moving=false;
let aiming=false;
let gameOver=false;

let striker={
  x:350,
  y:625,
  r:15,
  vx:0,
  vy:0
};

const coins=[];
const particles=[];

const pockets=[
  {x:55,y:55},
  {x:645,y:55},
  {x:55,y:645},
  {x:645,y:645}
];

const BASE_Y={
  1:625,
  2:75
};

function resetStriker(){
  striker.x=350;
  striker.y=BASE_Y[player];
  striker.vx=0;
  striker.vy=0;
}

function makeCoins(){

  coins.length=0;

  // Queen
  coins.push({
    x:350,y:350,r:11,
    type:"queen",
    color:"#e53935",
    vx:0,vy:0,
    pocketed:false
  });

  const colors=["#111","#eee"];

  let positions=[];

  for(let ring=1;ring<=2;ring++){

    let count=ring===1?6:12;
    let radius=ring===1?25:50;

    for(let i=0;i<count;i++){

      let a=(Math.PI*2/count)*i;

      positions.push({
        x:350+Math.cos(a)*radius,
        y:350+Math.sin(a)*radius
      });
    }
  }

  positions.forEach((p,i)=>{
    coins.push({
      x:p.x,
      y:p.y,
      r:11,
      type:"coin",
      color:colors[i%2],
      vx:0,
      vy:0,
      pocketed:false
    });
  });
}

makeCoins();
resetStriker();

function drawBoard(){

  ctx.clearRect(0,0,W,H);

  // wood
  ctx.fillStyle="#b86b32";
  ctx.fillRect(0,0,W,H);

  // inner board
  ctx.fillStyle="#e6b56f";
  ctx.fillRect(35,35,630,630);

  // border
  ctx.strokeStyle="#542b12";
  ctx.lineWidth=8;
  ctx.strokeRect(35,35,630,630);

  // pockets
  pockets.forEach(p=>{
    ctx.beginPath();
    ctx.fillStyle="#080808";
    ctx.arc(p.x,p.y,27,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#30190b";
    ctx.lineWidth=5;
    ctx.stroke();
  });

  // center circles
  ctx.beginPath();
  ctx.strokeStyle="#8c351d";
  ctx.lineWidth=3;
  ctx.arc(350,350,65,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(350,350,10,0,Math.PI*2);
  ctx.stroke();

  // baseline
  ctx.strokeStyle=player===1?"#176dff":"#22cc66";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(120,BASE_Y[player]);
  ctx.lineTo(580,BASE_Y[player]);
  ctx.stroke();

  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(120,BASE_Y[player]-18);
  ctx.lineTo(580,BASE_Y[player]-18);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(120,BASE_Y[player]+18);
  ctx.lineTo(580,BASE_Y[player]+18);
  ctx.stroke();
}

function drawCoins(){

  coins.forEach(c=>{

    if(c.pocketed)return;

    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);

    ctx.fillStyle=c.color;
    ctx.fill();

    ctx.strokeStyle="#777";
    ctx.lineWidth=2;
    ctx.stroke();

    if(c.type==="queen"){
      ctx.fillStyle="#fff";
      ctx.font="bold 12px Arial";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText("Q",c.x,c.y);
    }
  });
}

function drawStriker(){

  ctx.save();

  ctx.beginPath();
  ctx.arc(striker.x,striker.y,striker.r,0,Math.PI*2);

  ctx.fillStyle=player===1?"#2477ff":"#27d86d";
  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.stroke();

  // aiming line
  if(aiming && !moving){

    ctx.beginPath();
    ctx.moveTo(striker.x,striker.y);

    let dx=striker.x-mouse.x;
    let dy=striker.y-mouse.y;

    let length=Math.sqrt(dx*dx+dy*dy);

    if(length>0){
      dx/=length;
      dy/=length;
    }

    ctx.lineTo(
      striker.x+dx*120,
      striker.y+dy*120
    );

    ctx.strokeStyle="#39ff88";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles(){

  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  });
}

function draw(){

  drawBoard();
  drawCoins();
  drawStriker();
  drawParticles();

  requestAnimationFrame(draw);
}

draw();

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function createParticles(x,y,color){

  for(let i=0;i<8;i++){

    particles.push({
      x:x,
      y:y,
      r:Math.random()*3+1,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      life:1,
      color:color
    });
  }
}

function updateParticles(){

  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life-=.035;
  });

  for(let i=particles.length-1;i>=0;i--){
    if(particles[i].life<=0)
      particles.splice(i,1);
  }
}

function update(){

  if(moving){

    striker.x+=striker.vx;
    striker.y+=striker.vy;

    striker.vx*=.985;
    striker.vy*=.985;

    // wall bounce
    if(striker.x-striker.r<40){
      striker.x=40+striker.r;
      striker.vx*=-.8;
    }

    if(striker.x+striker.r>660){
      striker.x=660-striker.r;
      striker.vx*=-.8;
    }

    if(striker.y-striker.r<40){
      striker.y=40+striker.r;
      striker.vy*=-.8;
    }

    if(striker.y+striker.r>660){
      striker.y=660-striker.r;
      striker.vy*=-.8;
    }

    // coin collision
    coins.forEach(c=>{

      if(c.pocketed)return;

      let dx=c.x-striker.x;
      let dy=c.y-striker.y;

      let d=Math.hypot(dx,dy);
      let minDist=c.r+striker.r;

      if(d<minDist && d>0){

        let nx=dx/d;
        let ny=dy/d;

        let speed=Math.hypot(striker.vx,striker.vy);

        c.vx=nx*speed*.75;
        c.vy=ny*speed*.75;

        striker.vx-=nx*speed*.35;
        striker.vy-=ny*speed*.35;

        c.x=striker.x+nx*minDist;
        c.y=striker.y+ny*minDist;

        createParticles(c.x,c.y,c.color);
      }
    });

    // coin movement
    coins.forEach(c=>{

      if(c.pocketed)return;

      c.x+=c.vx;
      c.y+=c.vy;

      c.vx*=.985;
      c.vy*=.985;

      if(c.x-c.r<40){
        c.x=40+c.r;
        c.vx*=-.8;
      }

      if(c.x+c.r>660){
        c.x=660-c.r;
        c.vx*=-.8;
      }

      if(c.y-c.r<40){
        c.y=40+c.r;
        c.vy*=-.8;
      }

      if(c.y+c.r>660){
        c.y=660-c.r;
        c.vy*=-.8;
      }

      checkPocket(c);
    });

    checkPocket(striker);

    // stop
    let strikerSpeed=Math.hypot(striker.vx,striker.vy);

    let coinMoving=coins.some(c=>
      !c.pocketed && Math.hypot(c.vx,c.vy)>.08
    );

    if(strikerSpeed<.08 && !coinMoving){

      striker.vx=0;
      striker.vy=0;

      moving=false;

      // IMPORTANT:
      // striker always returns to correct baseline
      switchPlayer();
    }
  }

  updateParticles();

  requestAnimationFrame(update);
}

update();

function checkPocket(obj){

  for(const p of pockets){

    if(distance(obj,p)<30){

      if(obj===striker){

        createParticles(obj.x,obj.y,"#39ff88");

        // striker penalty
        if(player===1)
          score1=Math.max(0,score1-5);
        else
          score2=Math.max(0,score2-5);

        updateScore();

        // reset striker immediately
        resetStriker();

        return;
      }

      if(obj.pocketed)return;

      obj.pocketed=true;
      obj.vx=0;
      obj.vy=0;

      createParticles(obj.x,obj.y,obj.color);

      if(obj.type==="queen"){

        if(player===1)score1+=50;
        else score2+=50;

      }else{

        if(player===1)score1+=10;
        else score2+=10;
      }

      updateScore();
      return;
    }
  }
}

function switchPlayer(){

  if(gameOver)return;

  player=player===1?2:1;

  resetStriker();

  updateTurn();

  if(checkWin())return;

  document.getElementById("message").textContent=
    "Player "+player+" — Aim, drag backward and release!";
}

function checkWin(){

  let remaining=coins.filter(c=>!c.pocketed).length;

  if(remaining===0){

    gameOver=true;

    let winner=score1>score2?1:score2>score1?2:0;

    if(winner===0){
      document.getElementById("turn").textContent="🤝 DRAW!";
      document.getElementById("message").textContent=
        "Game Over — It's a draw!";
    }else{
      document.getElementById("turn").textContent=
        "🏆 Player "+winner+" WINS!";
      document.getElementById("message").textContent=
        "Congratulations Player "+winner+"!";
    }

    return true;
  }

  return false;
}

function updateScore(){

  document.getElementById("score1").textContent=score1;
  document.getElementById("score2").textContent=score2;
}

function updateTurn(){

  document.getElementById("turn").textContent=
    "Player "+player+" Turn";
}

// -------------------------
// POINTER CONTROLS
// -------------------------

let mouse={x:350,y:625};

function getPos(e){

  const rect=canvas.getBoundingClientRect();

  return {
    x:(e.clientX-rect.left)*(W/rect.width),
    y:(e.clientY-rect.top)*(H/rect.height)
  };
}

canvas.addEventListener("pointerdown",e=>{

  if(moving || gameOver)return;

  const p=getPos(e);

  let d=Math.hypot(
    p.x-striker.x,
    p.y-striker.y
  );

  // Must start near striker
  if(d<45){

    aiming=true;
    mouse=p;

    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove",e=>{

  const p=getPos(e);

  mouse=p;

  if(!aiming)return;

  // maximum pull distance
  let dx=p.x-striker.x;
  let dy=p.y-striker.y;

  let d=Math.hypot(dx,dy);

  if(d>110){

    dx=dx/d*110;
    dy=dy/d*110;

    mouse.x=striker.x+dx;
    mouse.y=striker.y+dy;
  }
});

canvas.addEventListener("pointerup",e=>{

  if(!aiming)return;

  aiming=false;

  const p=mouse;

  let dx=striker.x-p.x;
  let dy=striker.y-p.y;

  let power=Math.hypot(dx,dy);

  if(power<12){
    return;
  }

  let maxPower=22;

  let speed=Math.min(power*.16,maxPower);

  let d=Math.hypot(dx,dy);

  striker.vx=dx/d*speed;
  striker.vy=dy/d*speed;

  moving=true;

  document.getElementById("message").textContent=
    "Shot taken! 🎯";
});

// -------------------------
// LEFT / RIGHT BASELINE
// -------------------------

function moveStriker(amount){

  if(moving || gameOver)return;

  striker.x+=amount;

  if(striker.x<125)
    striker.x=125;

  if(striker.x>575)
    striker.x=575;
}

document.getElementById("left")
.addEventListener("click",()=>{
  moveStriker(-35);
});

document.getElementById("right")
.addEventListener("click",()=>{
  moveStriker(35);
});

// -------------------------
// NEW GAME
// -------------------------

document.getElementById("new")
.addEventListener("click",newGame);

function newGame(){

  player=1;
  score1=0;
  score2=0;
  moving=false;
  aiming=false;
  gameOver=false;

  makeCoins();
  resetStriker();

  updateScore();
  updateTurn();

  document.getElementById("message").textContent=
    "Player 1 — Aim, drag backward and release!";
}

// Keyboard controls for PC

document.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft"){
    moveStriker(-20);
  }

  if(e.key==="ArrowRight"){
    moveStriker(20);
  }

  if(e.key==="r" || e.key==="R"){
    newGame();
  }
});

</script>

</body>
  </html>
