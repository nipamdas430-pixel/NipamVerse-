<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NipamVerse Archery</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#050807;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
  user-select:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#15351f 0,#07120b 45%,#020403 100%);
}

.top{
  position:absolute;
  top:12px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  z-index:5;
  font-size:16px;
  font-weight:bold;
  text-shadow:0 0 10px #20ff70;
}

.panel{
  padding:8px 14px;
  border:1px solid #20ff70;
  border-radius:12px;
  background:#07130cdd;
  box-shadow:0 0 12px #20ff7040;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#powerBox{
  position:absolute;
  left:18px;
  bottom:25px;
  width:42px;
  height:180px;
  border:2px solid #fff;
  border-radius:20px;
  background:#111c15;
  overflow:hidden;
  box-shadow:0 0 15px #20ff7050;
}

#power{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  background:#20ff70;
  box-shadow:0 0 15px #20ff70;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:75%;
  text-align:center;
  font-size:14px;
  opacity:.8;
  pointer-events:none;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 20px;
  background:#20ff70;
  color:#021006;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 0 15px #20ff7060;
}

#newGame{
  position:absolute;
  right:15px;
  bottom:20px;
  z-index:6;
  display:none;
}

#message{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:8;
  font-size:25px;
  font-weight:bold;
  text-shadow:0 0 15px #20ff70;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="game">

  <div class="top">
    <div class="panel">🏹 Score: <span id="score">0</span></div>
    <div class="panel">🎯 Arrows: <span id="arrows">10</span></div>
    <div class="panel">🏆 Best: <span id="best">0</span></div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="powerBox">
    <div id="power"></div>
  </div>

  <div id="hint">
    Drag from the bow backwards, then release to shoot!
  </div>

  <button id="newGame">NEW GAME</button>

  <div id="message"></div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H,dpr;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);

let score=0;
let arrows=10;
let best=Number(localStorage.getItem("nipam_archery_best")||0);

document.getElementById("best").textContent=best;

let target={
  x:0,
  y:0,
  r:105
};

let bow={
  x:0,
  y:0
};

let arrow={
  x:0,
  y:0,
  vx:0,
  vy:0,
  active:false
};

let aiming=false;
let startX=0;
let startY=0;
let power=0;

let particles=[];

function resetPositions(){
  target.x=W*0.72;
  target.y=H*0.42;
  target.r=Math.min(105,W*.15);

  bow.x=W*.20;
  bow.y=H*.70;

  arrow.x=bow.x;
  arrow.y=bow.y;
}

resetPositions();

function drawBackground(){

  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#061b10");
  g.addColorStop(.55,"#0b2113");
  g.addColorStop(1,"#020603");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // moon
  ctx.beginPath();
  ctx.arc(W*.83,H*.15,35,0,Math.PI*2);
  ctx.fillStyle="#dffff0";
  ctx.shadowColor="#20ff70";
  ctx.shadowBlur=25;
  ctx.fill();
  ctx.shadowBlur=0;

  // trees
  for(let i=0;i<9;i++){
    let x=i*(W/8);

    ctx.fillStyle="#031008";
    ctx.fillRect(x-8,H*.45,16,H*.35);

    ctx.beginPath();
    ctx.moveTo(x,H*.25);
    ctx.lineTo(x-70,H*.55);
    ctx.lineTo(x+70,H*.55);
    ctx.closePath();
    ctx.fill();
  }

  // ground
  ctx.fillStyle="#020502";
  ctx.fillRect(0,H*.78,W,H*.22);
}

function drawTarget(){

  let x=target.x;
  let y=target.y;
  let r=target.r;

  ctx.save();

  ctx.beginPath();
  ctx.arc(x,y,r+9,0,Math.PI*2);
  ctx.fillStyle="#f5f5f5";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle="#d92525";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x,y,r*.72,0,Math.PI*2);
  ctx.fillStyle="#f5f5f5";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x,y,r*.48,0,Math.PI*2);
  ctx.fillStyle="#d92525";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x,y,r*.25,0,Math.PI*2);
  ctx.fillStyle="#f7e34b";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x,y,r*.11,0,Math.PI*2);
  ctx.fillStyle="#20ff70";
  ctx.shadowColor="#20ff70";
  ctx.shadowBlur=12;
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.restore();
}

function drawBow(){

  let x = bow.x;
  let y = bow.y;

  ctx.save();

  // Bow
  ctx.strokeStyle = "#8b5a2b";
  ctx.lineWidth = 9;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.arc(x + 15, y, 90, -Math.PI * 0.72, Math.PI * 0.72);
  ctx.stroke();

  // Fixed bowstring
  ctx.strokeStyle = "#eeeeee";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(x - 40, y - 72);
  ctx.lineTo(x - 40, y + 72);
  ctx.stroke();

  ctx.restore();
                 }


function drawArrow(){

  if(!aiming && !arrow.active){
    arrow.x=bow.x;
    arrow.y=bow.y;
  }

  let angle=Math.atan2(arrow.vy,arrow.vx);

  if(!arrow.active && aiming){
    angle=Math.atan2(bow.y-arrow.y,bow.x-arrow.x);
  }

  ctx.save();
  ctx.translate(arrow.x,arrow.y);
  ctx.rotate(angle);

  ctx.strokeStyle="#eee";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.moveTo(-45,0);
  ctx.lineTo(15,0);
  ctx.stroke();

  ctx.fillStyle="#bbb";
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.lineTo(5,-7);
  ctx.lineTo(5,7);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#20ff70";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-42,0);
  ctx.lineTo(-55,-8);
  ctx.moveTo(-42,0);
  ctx.lineTo(-55,8);
  ctx.stroke();

  ctx.restore();
}

function drawParticles(){

  for(let p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

function burst(x,y,color="#20ff70"){

  for(let i=0;i<25;i++){
    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,
      life:1,
      size:2+Math.random()*4,
      color
    });
  }
}

function updateParticles(){

  for(let p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.12;
    p.life-=.025;
  }

  particles=particles.filter(p=>p.life>0);
}

function updateArrow(){

  if(!arrow.active) return;

  arrow.x+=arrow.vx;
  arrow.y+=arrow.vy;

  arrow.vy+=.18;

  let dx=arrow.x-target.x;
  let dy=arrow.y-target.y;
  let dist=Math.sqrt(dx*dx+dy*dy);

  if(dist<target.r+8){

    arrow.active=false;

    let points=0;

    if(dist<target.r*.11) points=100;
    else if(dist<target.r*.25) points=60;
    else if(dist<target.r*.48) points=40;
    else if(dist<target.r*.72) points=25;
    else if(dist<target.r) points=15;
    else points=5;

    score+=points;

    if(score>best){
      best=score;
      localStorage.setItem("nipam_archery_best",best);
    }

    burst(arrow.x,arrow.y);

    showMessage("+"+points+" 🎯");

    arrows--;

    updateUI();

    setTimeout(nextArrow,700);
  }

  if(
    arrow.x>W+100 ||
    arrow.x<-100 ||
    arrow.y>H+100 ||
    arrow.y<-100
  ){
    arrow.active=false;
    arrows--;
    updateUI();
    setTimeout(nextArrow,400);
  }
}

function nextArrow(){

  if(arrows<=0){
    showMessage("GAME OVER 🏹<br>Score: "+score);
    document.getElementById("newGame").style.display="block";
    return;
  }

  arrow.x=bow.x;
  arrow.y=bow.y;
  arrow.vx=0;
  arrow.vy=0;
  arrow.active=false;
}

function updateUI(){

  document.getElementById("score").textContent=score;
  document.getElementById("arrows").textContent=arrows;
  document.getElementById("best").textContent=best;
}

function showMessage(text){

  const m=document.getElementById("message");
  m.innerHTML=text;

  setTimeout(()=>{
    if(m.innerHTML===text) m.innerHTML="";
  },900);
}

function shoot(){

  if(arrow.active || arrows<=0) return;

  let dx=bow.x-arrow.x;
  let dy=bow.y-arrow.y;

  let dist=Math.sqrt(dx*dx+dy*dy);

  if(dist<15) return;

  let strength=Math.min(dist,180);

  arrow.vx=(dx/dist)*strength*.085;
  arrow.vy=(dy/dist)*strength*.085;

  arrow.active=true;

  document.getElementById("power").style.height="0%";
}

function pointerDown(x,y){

  if(arrow.active || arrows<=0) return;

  let dx=x-arrow.x;
  let dy=y-arrow.y;

  if(Math.sqrt(dx*dx+dy*dy)<70){
    aiming=true;
    startX=x;
    startY=y;
  }
}

function pointerMove(x,y){

  if(!aiming || arrow.active) return;

  let dx=x-bow.x;
  let dy=y-bow.y;

  let dist=Math.sqrt(dx*dx+dy*dy);

  if(dist>180){
    let a=Math.atan2(dy,dx);
    dx=Math.cos(a)*180;
    dy=Math.sin(a)*180;
  }

  arrow.x=bow.x+dx;
  arrow.y=bow.y+dy;

  power=Math.min(100,Math.sqrt(dx*dx+dy*dy)/180*100);

  document.getElementById("power").style.height=power+"%";
}

function pointerUp(){

  if(!aiming) return;

  aiming=false;
  shoot();
}

// Mouse
canvas.addEventListener("mousedown",e=>{
  pointerDown(e.clientX,e.clientY);
});

canvas.addEventListener("mousemove",e=>{
  pointerMove(e.clientX,e.clientY);
});

canvas.addEventListener("mouseup",pointerUp);

// Touch
canvas.addEventListener("touchstart",e=>{
  e.preventDefault();
  let t=e.touches[0];
  pointerDown(t.clientX,t.clientY);
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  let t=e.touches[0];
  pointerMove(t.clientX,t.clientY);
},{passive:false});

canvas.addEventListener("touchend",e=>{
  e.preventDefault();
  pointerUp();
},{passive:false});

document.getElementById("newGame").onclick=()=>{

  score=0;
  arrows=10;

  document.getElementById("newGame").style.display="none";
  document.getElementById("message").innerHTML="";

  resetPositions();
  updateUI();
};

function loop(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawTarget();
  drawBow();
  drawArrow();
  drawParticles();

  updateArrow();
  updateParticles();

  requestAnimationFrame(loop);
}

updateUI();
loop();
</script>

</body>
  </html>
