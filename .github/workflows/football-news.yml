name: Update Football News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch football news with photos
        run: |
          python3 - <<'PY'
          import requests
          import xml.etree.ElementTree as ET
          import json
          import html
          import time
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse

          RSS = "https://news.google.com/rss/search?q=football%20soccer&hl=en-IN&gl=IN&ceid=IN:en"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          xml = requests.get(RSS, headers=headers, timeout=20).text
          root = ET.fromstring(xml)

          articles = []

          for item in root.findall(".//item")[:12]:

              title = html.unescape(item.findtext("title", "Football News"))
              link = item.findtext("link", "")
              date = item.findtext("pubDate", "")
              source = item.findtext("source", "Football News")

              image = ""

              try:
                  page = requests.get(
                      link,
                      headers=headers,
                      timeout=12,
                      allow_redirects=True
                  )

                  soup = BeautifulSoup(page.text, "html.parser")

                  og = soup.find(
                      "meta",
                      property="og:image"
                  )

                  if og and og.get("content"):
                      image = og["content"]

                  if not image:
                      twitter = soup.find(
                          "meta",
                          attrs={"name": "twitter:image"}
                      )

                      if twitter and twitter.get("content"):
                          image = twitter["content"]

              except Exception as e:
                  print("Image error:", e)

              articles.append({
                  "title": title,
                  "link": link,
                  "date": date,
                  "source": source,
                  "image": image
              })

              time.sleep(1)

          with open(
              "football-news.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  articles,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Updated:", len(articles), "articles")
          PY

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add football-news.json

          git diff --cached --quiet || git commit -m "Update football news"

          git push
