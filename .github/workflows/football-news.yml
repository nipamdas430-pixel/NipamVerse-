name: Update Football News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Fetch latest football news
        run: |
          python <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from html import unescape

          import feedparser
          import requests
          from bs4 import BeautifulSoup

          feeds = [
              {
                  "url": "https://feeds.bbci.co.uk/sport/football/rss.xml",
                  "source": "BBC Sport"
              },
              {
                  "url": "https://www.espn.com/espn/rss/soccer/news",
                  "source": "ESPN"
              }
          ]

          news = []
          seen = set()

          def clean_html(text):
              if not text:
                  return ""

              text = unescape(text)
              soup = BeautifulSoup(text, "html.parser")
              text = soup.get_text(" ", strip=True)
              text = re.sub(r"\s+", " ", text)

              return text.strip()

          def split_points(text):
              if not text:
                  return []

              parts = re.split(r"(?<=[.!?])\s+", text)
              parts = [p.strip() for p in parts if p.strip()]

              return parts[:3]

          def get_meta_description(url):
              try:
                  response = requests.get(
                      url,
                      timeout=10,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  if response.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  og = soup.find(
                      "meta",
                      attrs={"property": "og:description"}
                  )

                  if og and og.get("content"):
                      return clean_html(og["content"])

                  meta = soup.find(
                      "meta",
                      attrs={"name": "description"}
                  )

                  if meta and meta.get("content"):
                      return clean_html(meta["content"])

              except Exception:
                  pass

              return ""

          for feed_info in feeds:
              try:
                  feed = feedparser.parse(feed_info["url"])

                  for entry in feed.entries[:15]:
                      title = clean_html(
                          entry.get("title", "")
                      )

                      link = entry.get("link", "")

                      description = clean_html(
                          entry.get("summary", "")
                      )

                      if not description:
                          description = clean_html(
                              entry.get("description", "")
                          )

                      if len(description) < 80 and link:
                          extra = get_meta_description(link)

                          if extra:
                              description = extra

                      if not title or not description:
                          continue

                      key = title.lower()

                      if key in seen:
                          continue

                      seen.add(key)

                      points = split_points(description)

                      if not points:
                          points = [
                              description
                          ]

                      published = (
                          entry.get("published")
                          or entry.get("updated")
                          or ""
                      )

                      category = "Football"

                      lower_title = title.lower()

                      if (
                          "messi" in lower_title
                          or "inter miami" in lower_title
                      ):
                          category = "Messi"

                      elif (
                          "argentina" in lower_title
                          or "albiceleste" in lower_title
                      ):
                          category = "Argentina"

                      news.append({
                          "title": title,
                          "description": description,
                          "content": description,
                          "points": points,
                          "source": feed_info["source"],
                          "published": published,
                          "category": category,
                          "link": link
                      })

              except Exception as error:
                  print(
                      f"Feed error: {feed_info['source']}: {error}"
                  )

          news.sort(
              key=lambda item: item.get("published", ""),
              reverse=True
          )

          news = news[:30]

          output = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "news": news
          }

          with open(
              "football-news.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Saved {len(news)} football news items."
          )
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add football-news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update football news"
            git push
          fi
