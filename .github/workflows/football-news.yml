name: Update Football News

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: |
          pip install feedparser beautifulsoup4

      - name: Fetch latest football news
        run: |

          python <<'PY'

          import feedparser
          import json
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone


          FEEDS = [

              (
                "BBC Sport Football",
                "https://feeds.bbci.co.uk/sport/football/rss.xml"
              ),

              (
                "ESPN Football",
                "https://www.espn.com/espn/rss/soccer/news"
              )

          ]


          news = []
          seen = set()


          def clean(text):

              if not text:
                  return ""

              soup = BeautifulSoup(
                  text,
                  "html.parser"
              )

              text =
                  soup.get_text(
                      " ",
                      strip=True
                  )

              text =
                  re.sub(
                      r"\s+",
                      " ",
                      text
                  )

              return text.strip()


          for source, url in FEEDS:

              try:

                  feed =
                      feedparser.parse(url)

                  for entry in feed.entries[:20]:

                      title =
                          clean(
                              entry.get(
                                  "title",
                                  ""
                              )
                          )

                      if not title:
                          continue

                      key =
                          title.lower()

                      if key in seen:
                          continue

                      seen.add(key)

                      description =
                          clean(
                              entry.get(
                                  "summary",
                                  entry.get(
                                      "description",
                                      ""
                                  )
                              )
                          )

                      category =
                          "Football"

                      lower =
                          title.lower()

                      if (
                          "messi" in lower
                          or
                          "inter miami" in lower
                      ):
                          category = "Messi"

                      elif "argentina" in lower:
                          category = "Argentina"

                      elif (
                          "ballon d'or" in lower
                          or
                          "ballon dor" in lower
                      ):
                          category = "Ballon d'Or"

                      elif "premier league" in lower:
                          category = "Premier League"


                      news.append({

                          "category": category,

                          "title": title,

                          "description":
                              description,

                          "summary":
                              description,

                          "content":
                              description,

                          "source": source,

                          "published":
                              entry.get(
                                  "published",
                                  entry.get(
                                      "updated",
                                      ""
                                  )
                              )

                      )

              except Exception as error:

                  print(
                      "Feed error:",
                      source,
                      error
                  )


          news = news[:30]


          output = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "news": news

          }


          with open(
              "football-news.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Football stories:",
              len(news)
          )

          PY


      - name: Save changes
        run: |

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add football-news.json

          git diff --cached --quiet || \
            git commit -m "Update football news"

          git push
